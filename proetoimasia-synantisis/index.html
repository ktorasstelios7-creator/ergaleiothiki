<!doctype html><html lang="el"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Προετοιμασία συνάντησης Σ.Ε.Α. · Εργαλειοθήκη</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f2f5;color:#242338;font:17px/1.55 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px}a{color:#673761}h1{line-height:1.16;font: bold clamp(1.9rem,5vw,3rem)/1.16 Georgia,serif;margin-bottom:.4em}fieldset,section{background:white;border:1px solid #d4ccd5;border-radius:14px;padding:20px;margin:16px 0;min-width:0}legend,h2{font-weight:700;font-size:1.2rem;color:#633862}label{display:block;margin:.7rem 0;font-weight:600}input,textarea,select{display:block;width:100%;padding:.6rem;border:1px solid #837784;border-radius:6px;font:inherit;margin-top:.25rem}button{background:#61385f;color:white;border:0;border-radius:8px;font:inherit;padding:12px 20px;cursor:pointer}ul{padding-left:1.5em}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:640px){.pair{display:block}main{padding:16px}}@media print{form,nav,button,main>p{display:none}section{border:0}body{background:white}}</style><main><nav><a href="../?ekpaideftikoi">Επιστροφή στην Εργαλειοθήκη</a></nav><h1>Προετοιμασία συνάντησης Σ.Ε.Α.</h1><p>Διάλεξε θέμα και προσάρμοσε το πλάνο στον χρόνο της συνάντησης. Κράτησε σύντομες σημειώσεις χωρίς ονόματα.</p><form><fieldset><legend>Θέμα συνάντησης</legend><label>Αφορμή<select><option>Επιλογή σπουδών</option><option>Οργάνωση μελέτης</option><option>Σχέσεις με συνομηλίκους</option><option>Προσαρμογή στο σχολείο</option></select></label><h2>Ερωτήσεις για τη συζήτηση</h2><ul></ul></fieldset><fieldset><legend>Το πλάνο μου</legend><label>Τι θέλω να διερευνήσω;<textarea rows="2"></textarea></label><label>Τι θέλει να πετύχει ο μαθητής ή η μαθήτρια;<textarea rows="2"></textarea></label><label>Επόμενο βήμα που θα προτείνω<textarea rows="2"></textarea></label><label>Πότε θα επανέλθουμε;<textarea rows="2"></textarea></label></fieldset><button>Δημιουργία σύνοψης</button></form><section hidden id="summary" tabindex="-1"><h2>Η σύνοψή μου</h2><pre></pre><button type="button" onclick="window.print()">Εκτύπωση ή PDF</button></section></main><script>const form=document.querySelector('form'),summary=document.querySelector('#summary');const topics={"Επιλογή σπουδών":["Τι ελπίζεις να ξεκαθαρίσεις σήμερα;","Πότε απόλαυσες κάτι που σχετίζεται με αυτή τη σχολή;","Ποια πληροφορία θα έκανε την απόφαση πιο εύκολη;"],"Οργάνωση μελέτης":["Πώς κυλά ένα συνηθισμένο απόγευμα διαβάσματος;","Ποια μέρα πήγε λίγο καλύτερα και τι βοήθησε;","Ποια μικρή αλλαγή θέλεις να δοκιμάσεις αυτή την εβδομάδα;"],"Σχέσεις με συνομηλίκους":["Τι θα ήθελες να καταλάβω για όσα έγιναν;","Με ποιον νιώθεις άνετα στο σχολείο;","Τι θα ήθελες να αλλάξει μέχρι την επόμενη συνάντηση;"],"Προσαρμογή στο σχολείο":["Πώς είναι για σένα μια συνηθισμένη μέρα εδώ;","Ποιες στιγμές της ημέρας νιώθεις πιο άνετα;","Ποιος ή τι θα σε βοηθούσε στο επόμενο βήμα;"]},select=form.querySelector('select');function refresh(){const list=form.querySelector('ul');list.replaceChildren();for(const question of topics[select.value]){const li=document.createElement('li');li.textContent=question;list.append(li)}}select.addEventListener('change',()=>{refresh();summary.hidden=true});refresh();form.addEventListener('input',()=>summary.hidden=true);form.addEventListener('submit',event=>{event.preventDefault();const sections=[...form.querySelectorAll('fieldset')].map(group=>{const lines=[group.querySelector('legend').textContent];for(const label of group.querySelectorAll('label')){const value=label.querySelector('input,textarea,select').value.trim();if(value)lines.push(label.firstChild.textContent+'\n'+value)}for(const li of group.querySelectorAll('li'))lines.push('• '+li.textContent);return lines.join('\n\n')});summary.querySelector('pre').textContent=sections.join('\n\n────────\n\n');summary.hidden=false;summary.focus()});</script></html>
