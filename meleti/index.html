<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Διαβάζω έξυπνα: Μελέτη και εξετάσεις</title>
<meta name="theme-color" content="#6b3f72">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/favicon.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Εργαλειοθήκη">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a study desk. Six evidence-based techniques as cards, a weekly planner grid you colour by subject, a focus timer, and a season plan for the Pancyprian exams. Stress links go to «Ανάσα». */
:root{
  --bg:#EDF3EF;--surface:#FFFFFF;--soft:#DCEAE2;--ink:#14281F;--muted:#55695F;--line:#CBDCD2;
  --accent:#137A5B;--accent-ink:#FFFFFF;--warm:#F2994A;--warm-soft:#FCEBDA;
  --good:#2D8A57;--ok:#B7791F;--bad:#C2412D;--myth:#C2412D;--truth:#2D6FB8;
  --c-vape:#5B6BD6;--c-alc:#B5462E;--c-subs:#8A3FB0;--c-bet:#2E7D4F;
  --font-d:'Literata',Georgia,'Times New Roman',serif;--font-b:'Commissioner',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --r:14px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1813;--surface:#15241D;--soft:#1D3229;--ink:#E3EEE8;--muted:#9AB2A6;--line:#2A4237;
  --accent:#4CC79E;--accent-ink:#06201A;--warm:#F5AE6B;--warm-soft:#3A2A1B;
  --good:#5CC48A;--ok:#E5B04F;--bad:#F07C66;--myth:#F07C66;--truth:#7FB2EE;
  --c-vape:#97A3F2;--c-alc:#EE8A70;--c-subs:#C58BEA;--c-bet:#6FCB94;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:17px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--font-d);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,5vw,2.4rem)}h2{font-size:1.55rem}h3{font-size:1.15rem}
p{margin:0}
a{color:var(--accent)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--warm);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:.9rem}
.prose{max-width:65ch}
ul.clean{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--font-d);font-weight:700;font-size:1.25rem}
.grow{flex:1}
.lvl{font-size:.85rem;color:var(--muted);text-align:right;line-height:1.2}
.lvl b{display:block;color:var(--ink);font-size:.95rem}
@media (max-width:560px){.lvl{display:none}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sos{background:var(--warm);border-color:var(--warm);color:#1d1205}
main{padding:24px 0 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.soft{background:var(--soft);border-color:transparent}
.take{background:var(--warm-soft);border-left:5px solid var(--warm);border-radius:10px;padding:14px 16px}
.alert{border:2px solid var(--bad);border-radius:12px;padding:14px 16px;background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.eyebrow{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem}
.vhead{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.sec-title{margin:30px 0 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.topic{--sc:var(--accent);text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--sc);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.topic:hover{transform:translateY(-2px);border-color:var(--sc)}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--sc) 14%,var(--surface));color:var(--sc)}
.ico svg{width:26px;height:26px}
.chip{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);align-self:flex-start}
.chip.ok{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--good)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tools a{text-decoration:none;color:var(--ink)}
.tools .card{height:100%;display:flex;flex-direction:column;gap:6px}
.tools .card:hover{border-color:var(--accent)}
.big{font-family:var(--font-d);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}

/* myth card */
.sbar{display:flex;gap:5px}.sbar span{flex:1;height:6px;border-radius:999px;background:var(--line)}.sbar span.on{background:var(--sc,var(--accent))}
.deck{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.07);border-top:8px solid var(--sc,var(--accent))}
.mcard .stmt{font-family:var(--font-d);font-size:clamp(1.3rem,3.6vw,1.65rem);line-height:1.3}
.mcard .tag{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sc,var(--accent))}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;font-weight:700;font-size:1.1rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.choice button small{font-weight:500;font-size:.8rem;color:var(--muted)}
.choice .bm:hover{border-color:var(--myth)}.choice .bt:hover{border-color:var(--truth)}
.choice button[disabled]{cursor:default;opacity:.5}
.verdict{border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.verdict.myth{background:color-mix(in srgb,var(--myth) 11%,var(--surface));border:1px solid var(--myth)}
.verdict.truth{background:color-mix(in srgb,var(--truth) 11%,var(--surface));border:1px solid var(--truth)}
.verdict .lab{font-family:var(--font-d);font-size:1.3rem;font-weight:700}
.verdict.myth .lab{color:var(--myth)}.verdict.truth .lab{color:var(--truth)}
.res{font-weight:700}.res.y{color:var(--good)}.res.n{color:var(--bad)}
.next{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
/* scenario */
.sit{font-family:var(--font-d);font-size:1.3rem;line-height:1.35;padding:20px;border-radius:16px;background:var(--soft)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.s2{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.s1{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.s0{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt.dim{opacity:.6}
.fb{border-radius:12px;padding:14px 16px;background:var(--soft);display:flex;flex-direction:column;gap:6px}
.fb b.t2{color:var(--good)}.fb b.t1{color:var(--ok)}.fb b.t0{color:var(--bad)}
.ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ways .card{display:flex;flex-direction:column;gap:6px}
.ways .q{font-family:var(--font-d);font-style:italic}
textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:70px;resize:vertical}
.mine{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.mine button{border:none;background:none;cursor:pointer;color:var(--muted)}
.line{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.line .tel{font-family:var(--font-d);font-size:1.45rem;font-weight:700;color:var(--accent);min-width:110px;font-variant-numeric:tabular-nums;text-decoration:none}
@media (max-width:520px){.line{flex-direction:column;align-items:flex-start;gap:4px}}
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 97%,transparent);overflow:auto;padding:24px 16px}
.overlay[hidden]{display:none}
.overlay .inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tablebox{overflow-x:auto}
footer{border-top:1px solid var(--line);padding:22px 0 70px;color:var(--muted);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media print{.top,.no-print,footer,.ergal-back{display:none!important}body{background:#fff;color:#000}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* app-specific */
:root{--bg:#EEF1F8;--surface:#FFFFFF;--soft:#DFE5F3;--ink:#16203A;--muted:#58637E;--line:#CFD7EA;--accent:#2F5BD3;--accent-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1322;--surface:#161D31;--soft:#1F2842;--ink:#E5EAF6;--muted:#9AA6C2;--line:#2C3657;--accent:#7FA0FF;--accent-ink:#0E1322}}
.tech{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.tech .card{display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--accent)}
.tech .em{font-size:1.8rem}
.tech .how{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.93rem}
.week{display:grid;grid-template-columns:110px repeat(7,minmax(0,1fr));gap:4px;min-width:760px}
.week .h{font-size:.8rem;font-weight:700;color:var(--muted);text-align:center;padding:6px 0}
.week .rl{font-size:.82rem;color:var(--muted);display:flex;align-items:center}
.cell{min-height:54px;border:1px dashed var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:.8rem;font-weight:600;padding:4px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.cell.f{border-style:solid;color:#fff}
.cell:hover{border-color:var(--accent)}
.subj{display:flex;gap:6px;flex-wrap:wrap}
.subj button{border:2px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;color:#fff}
.subj button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.timer{font-family:var(--font-d);font-size:clamp(3.5rem,14vw,6rem);font-weight:700;font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.ring{width:240px;height:240px;margin:0 auto;display:block}
.phase{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.phase .when{font-weight:700;color:var(--accent);min-width:120px}
.phase.now{background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:10px;padding:14px}
@media (max-width:560px){.phase{grid-template-columns:1fr}}
input[type=date],input[type=text]{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.qz{display:flex;flex-direction:column;gap:8px}
.qz .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.qz .opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.tablebox{overflow-x:auto}

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="Διαβάζω έξυπνα, αρχική">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="var(--accent)"/><path d="M8 11c3-1.5 6-1.5 9 0v13c-3-1.5-6-1.5-9 0zM17 11c3-1.5 6-1.5 9 0v13c-3-1.5-6-1.5-9 0z" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linejoin="round"/></svg>
      Διαβάζω έξυπνα
    </a>
    <div class="grow"></div>
    <a class="btn" href="../anasa/#exam" style="white-space:nowrap">Άγχος; → Ανάσα</a>
  </div>
</header>

<main class="wrap" id="app" tabindex="-1"></main>

<footer><div class="wrap stack" style="gap:6px">
  <p>«Διαβάζω έξυπνα», Στέλιος Κτώρας, Καθηγητής Σ.Ε.Α. Μέρος της <a href="https://ktorasstelios7-creator.github.io/ergaleiothiki/">Σύγχρονης Εργαλειοθήκης για εκπαιδευτικούς και μαθητές</a>.</p>
  <p class="small">Το πρόγραμμά σου μένει μόνο σε αυτή τη συσκευή. <a href="#teachers">Για εκπαιδευτικούς</a> · <a href="#sources">Πηγές</a></p>
</div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const app=document.getElementById('app');
const back='<a class="back" href="#home">← Αρχική</a>';
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2400);}
const KEY='meleti-v1';
let S={subs:[['Μαθηματικά','#2F5BD3'],['Νέα Ελληνικά','#B5462E'],['Φυσική','#2E7D4F'],['Αγγλικά','#8A3FB0']],grid:{},exam:'',quiz:{}};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const PAL=['#2F5BD3','#B5462E','#2E7D4F','#8A3FB0','#C27C0E','#1F7A8C','#C2417A','#5A6270'];

/* ---------- techniques ---------- */
const TECH=[
 ['🧠','Ανάκληση','Κλείσε το βιβλίο και ανάκαλε από μνήμης.','Κάθε φορά που «τραβάς» μια πληροφορία από τη μνήμη, τη δυναμώνεις. Είναι η πιο ισχυρή τεχνική που ξέρουμε, πολύ πιο αποτελεσματική από το ξαναδιάβασμα.','Διάβασε μία ενότητα. Κλείσε το βιβλίο. Γράψε σε λευκό χαρτί ό,τι θυμάσαι. Μετά άνοιξε και συμπλήρωσε με άλλο χρώμα όσα ξέχασες. Αυτά είναι που πρέπει να ξαναδείς.'],
 ['📅','Κατανεμημένη επανάληψη','Λίγο και συχνά, όχι όλα την τελευταία νύχτα.','Όταν αφήνεις λίγο χρόνο να περάσει και επανέρχεσαι, ο εγκέφαλος κρατά την πληροφορία πολύ περισσότερο. Το «φόρτωμα» της τελευταίας νύχτας ξεχνιέται γρήγορα.','Μετά το μάθημα: επανάληψη την επόμενη μέρα, μετά από 3 μέρες, μετά από μία εβδομάδα και μετά από έναν μήνα. Βάλε τις επαναλήψεις στον προγραμματιστή σου.'],
 ['🔀','Εναλλαγή','Ανακάτεψε τύπους ασκήσεων.','Αν λύνεις 10 ίδιες ασκήσεις στη σειρά, μαθαίνεις τη «συνταγή» και όχι πότε να τη χρησιμοποιείς. Στις εξετάσεις τα θέματα έρχονται ανακατεμένα.','Αντί για 10 ασκήσεις παραγώγων και μετά 10 ολοκληρωμάτων, κάνε τις ανακατεμένες. Πριν λύσεις, ρώτα: «Τι είδους άσκηση είναι αυτή;»'],
 ['🗣️','Εξήγησέ το','Δίδαξέ το σε κάποιον, ακόμα και φανταστικό.','Όταν εξηγείς «γιατί» και «πώς», συνδέεις τη νέα γνώση με όσα ήδη ξέρεις. Τα κενά σου φαίνονται αμέσως.','Εξήγησε την ενότητα σε έναν φίλο, στον αδερφό σου ή στον καθρέφτη, με απλά λόγια. Όπου κολλάς, εκεί χρειάζεσαι δουλειά.'],
 ['🖼️','Λέξεις και εικόνες','Κάνε το κείμενο σχήμα.','Όταν έχεις την ίδια πληροφορία και σε λέξεις και σε εικόνα, έχεις δύο «δρόμους» για να τη βρεις στη μνήμη σου.','Μετάτρεψε μια ενότητα σε χρονογραμμή, διάγραμμα ροής ή εννοιολογικό χάρτη. Μετά ζωγράφισέ τον ξανά από μνήμης.'],
 ['🔍','Συγκεκριμένα παραδείγματα','Από το αφηρημένο στο πραγματικό.','Οι αφηρημένες ιδέες κολλάνε πιο εύκολα όταν τις δένεις με κάτι συγκεκριμένο.','Για κάθε έννοια βρες δύο παραδείγματα από τη ζωή και ρώτα: «Τι κοινό έχουν;»']
];
const QZ=[
 ['Έχεις διαγώνισμα σε 4 μέρες. Τι βοηθά περισσότερο;',['3 ώρες την παραμονή','45 λεπτά κάθε μέρα και για τις 4 μέρες'],1,'Ο ίδιος χρόνος, μοιρασμένος σε μέρες, δίνει πολύ καλύτερη μνήμη. Είναι η κατανεμημένη επανάληψη.'],
 ['Ποιο δουλεύει καλύτερα;',['Να ξαναδιαβάσω το κεφάλαιο 3 φορές','Να το διαβάσω μία φορά και να απαντήσω ερωτήσεις χωρίς βιβλίο'],1,'Η ανάκληση νικά το ξαναδιάβασμα. Το ξαναδιάβασμα σου δίνει την ψευδαίσθηση ότι «το ξέρω».'],
 ['Η υπογράμμιση με μαρκαδόρο…',['…είναι από τις πιο αποτελεσματικές τεχνικές','…βοηθά λίγο. Μόνη της δεν φτάνει'],1,'Είναι εύκολη και ευχάριστη, αλλά δεν σε κάνει να σκεφτείς. Χρησιμοποίησέ τη μόνο για να βρίσκεις τι θα ανακαλέσεις μετά.'],
 ['Ακούω μουσική με στίχους ενώ διαβάζω. Αυτό…',['…συνήθως δυσκολεύει την κατανόηση κειμένου','…δεν κάνει καμία διαφορά'],0,'Οι στίχοι «μιλούν» στο ίδιο κανάλι με αυτό που διαβάζεις. Αν θες μουσική, προτίμησε χωρίς στίχους.'],

 const c=e.target.closest('[data-cell]'); if(c){const k=c.dataset.cell; S.grid[k]=(S.grid[k]===brush)?null:brush; if(S.grid[k]===null) delete S.grid[k]; save();const y=scrollY;app.innerHTML=week();scrollTo(0,y);return;}
 if(e.target.closest('#addSub')){const v=document.getElementById('newSub').value.trim(); if(v){S.subs.push([v.slice(0,24),PAL[S.subs.length%PAL.length]]);brush=S.subs.length-1;save();app.innerHTML=week();} return;}
 if(e.target.closest('#delSub')){const i=brush; S.subs.splice(i,1); const g={}; Object.entries(S.grid).forEach(([k,v])=>{if(v===i)return; g[k]=v>i?v-1:v;}); S.grid=g; brush=0; save(); app.innerHTML=week(); return;}
 if(e.target.closest('#clearGrid')){S.grid={};save();app.innerHTML=week();return;}
 const m=e.target.closest('[data-mode]'); if(m){T.mode=m.dataset.mode.split(',').map(Number); clearInterval(T.iv); T.run=false; T.work=true; T.left=T.mode[0]*60; app.innerHTML=timer(); tDraw(); return;}
 if(e.target.closest('#tGo')){T.run=!T.run; clearInterval(T.iv); if(T.run) T.iv=setInterval(tick,1000); tDraw(); return;}
 if(e.target.closest('#tReset')){clearInterval(T.iv); T.run=false; T.work=true; T.left=T.mode[0]*60; tDraw(); return;}
});
app.addEventListener('change',e=>{if(e.target.id==='exD'){S.exam=e.target.value;save();app.innerHTML=pep();}});
route();
})();
</script>
