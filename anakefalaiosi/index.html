<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Εργαλείο Ανακεφαλαίωσης μαθημάτων «Διεργασία της Επαγγελματικής Αγωγής/Συμβουλευτικής Γ΄ Γυμνασίου και Α΄ Λυκείου»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Commissioner:wght@400;500;700;800&display=swap&subset=greek" rel="stylesheet">
<style>
:root{
  --ink:#1E2557; --ink2:#4A5185; --paper:#F6F7FF; --card:#FFFFFF; --line:#DADDF3;
  --sun:#FFC93C; --coral:#FF6F7D; --mint:#22C3A6; --sky:#5B8CFF; --grape:#8E6CEF;
  --ok:#17A589; --bad:#E2475A; --chipbg:#EEF0FF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EEF0FF; --ink2:#B4B9E0; --paper:#151935; --card:#20264A; --line:#353C6B; --chipbg:#2A3160;
  }
}
:root[data-theme="dark"]{ --ink:#EEF0FF; --ink2:#B4B9E0; --paper:#151935; --card:#20264A; --line:#353C6B; --chipbg:#2A3160; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:"Commissioner",system-ui,"Segoe UI",Arial,sans-serif; font-size:17px; line-height:1.55; -webkit-tap-highlight-color:transparent; }
h1,h2,h3{ font-family:"Comfortaa","Commissioner",system-ui,sans-serif; line-height:1.2; margin:0 0 .5em; }
h1{ font-size:clamp(2rem,7vw,3.4rem); letter-spacing:-.02em; }
h2{ font-size:clamp(1.45rem,4.6vw,2.1rem); }
h3{ font-size:1.12rem; }
p{ margin:.2em 0 .9em; }
a{ color:var(--sky); }
button{ font:inherit; color:inherit; cursor:pointer; }
:focus-visible{ outline:3px solid var(--sky); outline-offset:2px; border-radius:8px; }

/* top bar: metro line */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); padding:10px 16px 8px; border-bottom:1px solid var(--line); }
.toprow{ display:flex; align-items:center; gap:10px; max-width:820px; margin:0 auto; }
.metro{ flex:1; position:relative; height:22px; }
.metro .rail{ position:absolute; left:0; right:0; top:9px; height:4px; border-radius:4px; background:var(--line); }
.metro .fill{ position:absolute; left:0; top:9px; height:4px; border-radius:4px; background:linear-gradient(90deg,var(--coral),var(--sun) 45%,var(--mint)); transition:width .4s; }
.metro .stop{ position:absolute; top:3px; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:var(--card); border:3px solid var(--line); padding:0; }
.metro .stop.done{ border-color:var(--ink); background:var(--sun); }
.metro .stop.ch{ width:20px; height:20px; top:1px; margin-left:-10px; }
@media (max-width:600px){ .metro .stop:not(.ch){ width:10px; height:10px; top:6px; margin-left:-5px; border-width:2px; } }
.grid > .panel{ margin:0; }
.xp{ font-weight:800; font-size:.9rem; background:var(--sun); color:#1E2557; padding:4px 10px; border-radius:999px; white-space:nowrap; }
.xp.pop{ animation:pop .4s; }
@keyframes pop{ 50%{ transform:scale(1.25);} }
.chname{ max-width:820px; margin:4px auto 0; font-size:.82rem; color:var(--ink2); font-weight:600; }

main{ max-width:820px; margin:0 auto; padding:22px 18px 120px; }
.screen{ animation:enter .35s ease; }
@keyframes enter{ from{ opacity:0; transform:translateY(10px);} }
@media (prefers-reduced-motion:reduce){ .screen,.xp.pop{ animation:none; } .flip-in{ transition:none!important; } }

.lead{ font-size:1.08rem; color:var(--ink2); }
.panel{ background:var(--card); border:2px solid var(--line); border-radius:18px; padding:16px 18px; margin:12px 0; }
.grid{ display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); }
.chip{ display:inline-block; background:var(--chipbg); border-radius:999px; padding:5px 12px; margin:3px; font-size:.92rem; font-weight:500; }
.btn{ border:none; border-radius:14px; padding:12px 18px; font-weight:800; background:var(--ink); color:var(--paper); }
.btn.alt{ background:var(--chipbg); color:var(--ink); }
.btn.sun{ background:var(--sun); color:#1E2557; }
.tap{ text-align:left; width:100%; border:2px solid var(--line); background:var(--card); border-radius:16px; padding:14px 16px; transition:transform .12s, border-color .2s; }
.tap:active{ transform:scale(.98); }
.tap.on{ border-color:var(--ink); box-shadow:4px 4px 0 var(--sun); }
.hint{ font-size:.88rem; color:var(--ink2); }
.reveal{ display:none; margin-top:10px; }
.on > .reveal, .reveal.show{ display:block; }
.tag{ font-size:.75rem; font-weight:800; padding:2px 8px; border-radius:6px; background:var(--sun); color:#1E2557; }

/* nav */
.nav{ position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--paper); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); }
.navin{ max-width:820px; margin:0 auto; display:flex; gap:10px; align-items:center; }
.navin .sp{ flex:1; text-align:center; font-size:.85rem; color:var(--ink2); }

/* hero */
.hero{ text-align:left; padding-top:8px; }
.hero h1 span{ display:block; }
.hero .q2{ color:var(--coral); }
.hero .eyebrow{ font-family:"Comfortaa","Commissioner",sans-serif; font-weight:700; font-size:clamp(.95rem,2.6vw,1.12rem); line-height:1.4; color:var(--ink2); background:var(--chipbg); border-radius:14px; padding:10px 14px; margin:0 0 16px; text-wrap:balance; }
.trail{ margin:22px 0; }
.trail svg{ width:100%; height:auto; display:block; }
.chcards{ display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); }
.chcard{ border-radius:18px; padding:14px; color:#1E2557; text-align:left; border:none; }
.chcard b{ font-family:"Comfortaa",sans-serif; font-size:1.15rem; display:block; }

/* blobs */
.blobs{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.blob{ min-width:0; overflow-wrap:anywhere; hyphens:auto; }
.blob{ aspect-ratio:1; border-radius:46% 54% 58% 42% / 52% 44% 56% 48%; border:none; color:#fff; font-weight:800; font-size:clamp(.7rem,2.9vw,1.05rem); padding:6px; }
.blob:nth-child(2){ border-radius:58% 42% 45% 55% / 45% 58% 42% 55%; }
.blob:nth-child(3){ border-radius:42% 58% 52% 48% / 58% 46% 54% 42%; }

/* sort game */
.sortcard{ font-size:1.3rem; font-weight:800; text-align:center; padding:28px 16px; border-radius:20px; background:var(--card); border:3px dashed var(--line); margin:10px 0; min-height:96px; }
.sortbtns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sortbtns button{ padding:16px; border-radius:16px; border:none; font-weight:800; color:#1E2557; }
.fb{ min-height:1.6em; font-weight:700; text-align:center; }
.fb.ok{ color:var(--ok);} .fb.no{ color:var(--bad);}

/* tree */
.tree{ position:relative; max-width:520px; margin:0 auto; }
.tree svg{ width:100%; height:auto; display:block; }
.leaf{ cursor:pointer; }
.leaf ellipse{ transition:fill .2s, transform .2s; transform-box:fill-box; transform-origin:center; }
.leaf.on ellipse{ fill:var(--sun); transform:scale(1.12); }
.leaf text{ font-family:"Commissioner",sans-serif; font-size:11px; font-weight:700; fill:#123; pointer-events:none; }

/* venn */
.venn svg{ width:100%; max-width:440px; display:block; margin:0 auto; }
.venn circle{ cursor:pointer; mix-blend-mode:multiply; transition:opacity .2s; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .venn circle{ mix-blend-mode:screen; } }
.venn text{ font-family:"Comfortaa",sans-serif; font-weight:700; pointer-events:none; fill:#1E2557; }

/* steps */
.steps{ list-style:none; padding:0; margin:10px 0; counter-reset:s; }
.steps li{ position:relative; padding:10px 12px 10px 46px; margin:8px 0; background:var(--chipbg); border-radius:14px; }
.steps li::before{ counter-increment:s; content:counter(s); position:absolute; left:10px; top:10px; width:26px; height:26px; border-radius:50%; background:var(--ink); color:var(--paper); display:grid; place-items:center; font-weight:800; font-size:.85rem; }
.vote{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
.vote button{ border:2px solid var(--line); background:var(--card); border-radius:999px; padding:8px 14px; font-weight:700; }
textarea.lined{ display:block; width:100%; margin:6px 0 12px; font:inherit; color:var(--ink); border:2px solid var(--line); border-radius:12px; padding:2px 12px; line-height:32px; resize:vertical; background-color:var(--card); background-image:repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px); background-attachment:local; background-position:0 2px; }
.vote button.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

/* holland */
.hex svg{ width:100%; max-width:480px; display:block; margin:0 auto; }
.hex text{ font-family:"Commissioner",sans-serif; font-weight:800; font-size:13px; fill:var(--ink); }
.qrow{ display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); }
.qrow:last-child{ border:none; }
.seg{ display:flex; border:2px solid var(--line); border-radius:12px; overflow:hidden; flex-shrink:0; }
.seg button{ border:none; background:transparent; padding:6px 10px; font-size:.82rem; font-weight:700; }
.seg button.on{ background:var(--sun); color:#1E2557; }
.quote{ font-family:"Comfortaa",sans-serif; font-size:1.25rem; padding:18px 20px; border-left:6px solid var(--sun); background:var(--card); border-radius:0 16px 16px 0; }

/* trends orbit */
.orbit{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr)); gap:10px; }
.oct{ clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%); background:var(--sky); color:#fff; border:none; aspect-ratio:1; font-weight:800; padding:14px; font-size:.92rem; }
.oct.on{ background:var(--ink); }
.skchip{ border:2px solid transparent; color:var(--ink); cursor:pointer; }
.skchip.on{ background:var(--sun); color:#1E2557; border-color:var(--ink); }

/* gap bars */
.bars{ display:grid; gap:10px; }
.bar{ height:30px; border-radius:10px; position:relative; background:var(--chipbg); overflow:hidden; }
.bar i{ position:absolute; left:0; top:0; bottom:0; border-radius:10px; transition:width .3s; }
.bar span{ position:relative; z-index:1; font-size:.82rem; font-weight:700; padding:0 10px; line-height:30px; color:#1E2557; }
input[type=range]{ width:100%; accent-color:var(--coral); }

/* swipe */
.swipe{ text-align:center; }
.jobcard{ margin:12px auto; max-width:360px; padding:34px 18px; border-radius:24px; background:var(--card); border:3px solid var(--ink); box-shadow:8px 8px 0 var(--mint); font-size:1.35rem; font-weight:800; transition:transform .25s, opacity .25s; }
.jobcard small{ display:block; font-size:.95rem; font-weight:500; color:var(--ink2); line-height:1.45; margin-top:10px; }
.jobcard .jn{ display:block; font-size:.75rem; font-weight:700; color:var(--ink2); margin-top:12px; letter-spacing:.06em; }
.jlist{ display:grid; gap:8px; }
.jitem{ display:grid; gap:2px; background:var(--chipbg); border-radius:12px; padding:9px 12px; font-size:.92rem; }
.jitem span{ color:var(--ink2); }
.jitem.liked{ box-shadow:inset 4px 0 0 var(--mint); }
.jobcard.gol{ transform:translateX(-120%) rotate(-12deg); opacity:0; }
.jobcard.gor{ transform:translateX(120%) rotate(12deg); opacity:0; }
.swbtns{ display:flex; justify-content:center; gap:14px; }
.swbtns button{ width:64px; height:64px; border-radius:50%; border:3px solid var(--ink); background:var(--card); font-size:1.6rem; }

/* quiz */
.opts{ display:grid; gap:8px; grid-template-columns:repeat(2,minmax(0,1fr)); }
.opts button{ overflow-wrap:anywhere; hyphens:auto; }
.opts button{ border:2px solid var(--line); background:var(--card); border-radius:14px; padding:12px; font-weight:700; text-align:left; }
.opts button.ok{ background:var(--ok); color:#fff; border-color:var(--ok); }
.opts button.no{ background:var(--bad); color:#fff; border-color:var(--bad); }
.isco{ display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:.92rem; }
.isco b{ font-family:"Comfortaa",sans-serif; }

/* path map */
.pathmap{ display:grid; gap:12px; }
.lvl{ display:flex; gap:8px; flex-wrap:wrap; }
.node{ border:2px solid var(--ink); border-radius:14px; padding:10px 12px; background:var(--card); font-weight:700; font-size:.92rem; }
.node.on{ background:var(--ink); color:var(--paper); }
.arrow{ text-align:center; font-size:1.4rem; color:var(--ink2); line-height:1; }

/* OMP explorer */
.omps{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.omp{ border:none; border-radius:16px; padding:12px 6px; font-weight:800; color:#1E2557; font-size:.9rem; }
.omp b{ display:block; font-family:"Comfortaa",sans-serif; font-size:1.4rem; }
@media (max-width:600px){ .omps{ grid-template-columns:1fr 1fr; } }
.omp{ overflow-wrap:anywhere; min-width:0; }
.omp.on{ outline:3px solid var(--ink); outline-offset:2px; }
.kgrid{ display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr)); }
.k{ text-align:left; border:2px solid var(--line); border-radius:16px; padding:12px 14px; background:var(--card); }
.k .kc{ font-family:"Comfortaa",sans-serif; font-weight:700; font-size:1.3rem; }
.tablewrap{ overflow-x:auto; }
table{ border-collapse:collapse; width:100%; font-size:.9rem; }
th,td{ padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; }
th{ font-weight:800; }

/* match */
.match{ display:grid; grid-template-columns:minmax(90px,.4fr) 1fr; gap:10px; }
.match .col{ display:grid; gap:8px; align-content:start; }
.match button{ border:2px solid var(--line); background:var(--card); border-radius:12px; padding:10px; font-size:.88rem; text-align:left; font-weight:600; }
.match button.sel{ border-color:var(--ink); background:var(--sun); color:#1E2557; }
.match button.done{ border-color:var(--ok); background:var(--ok); color:#fff; opacity:.8; }
.match button.shake{ animation:shake .3s; border-color:var(--bad); }
.match button.mt{ background:var(--tc); border-color:var(--tc); color:#1E2557; font-size:1rem; }
.match button.mt.sel{ background:var(--tc); color:#1E2557; outline:3px solid var(--ink); outline-offset:2px; box-shadow:4px 4px 0 var(--ink); }
.match button.mt.done{ background:var(--tc); border-color:var(--tc); color:#1E2557; opacity:.7; }
.match button.md.done{ background:var(--tc); border-color:var(--tc); color:#1E2557; opacity:1; }
.match .mtag{ display:inline-block; background:rgba(255,255,255,.55); border-radius:6px; padding:0 6px; margin-right:4px; font-size:.8rem; }
@keyframes shake{ 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

details{ background:var(--card); border:2px solid var(--line); border-radius:14px; padding:10px 14px; margin:8px 0; }
summary{ font-weight:800; cursor:pointer; }
.links a{ display:block; padding:4px 0; word-break:break-word; }

/* passport */
.passport{ background:var(--ink); color:var(--paper); border-radius:22px; padding:22px; position:relative; overflow:hidden; }
.passport::after{ content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; background:var(--sun); opacity:.9; }
.passport h2{ position:relative; z-index:1; }
.passport .row{ position:relative; z-index:1; margin:10px 0; }
.passport .row small{ display:block; opacity:.75; font-size:.8rem; }
.passport .chip{ background:rgba(255,255,255,.15); color:var(--paper); }
input[type=text]{ font:inherit; padding:12px 14px; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--ink); width:100%; max-width:360px; }
.toast{ position:fixed; left:50%; top:calc(70px + env(safe-area-inset-top,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:8px 16px; border-radius:999px; font-weight:800; z-index:15; animation:toast 1.4s forwards; pointer-events:none; }
@keyframes toast{ 0%{opacity:0; transform:translate(-50%,10px)} 15%{opacity:1; transform:translate(-50%,0)} 80%{opacity:1} 100%{opacity:0; transform:translate(-50%,-14px)} }
.snd{ border:none; background:var(--chipbg); border-radius:999px; width:34px; height:30px; font-size:1rem; padding:0; }
.qz h3{ margin-bottom:10px; }
.qz .opts button:disabled{ cursor:default; }
.qz .why{ background:var(--chipbg); border-radius:12px; padding:10px 12px; margin-top:10px; font-size:.95rem; }
.qz .qtop{ display:flex; justify-content:space-between; align-items:center; font-size:.82rem; color:var(--ink2); font-weight:700; margin-bottom:6px; }
.qz .dots{ display:flex; gap:4px; } .qz .dots i{ width:8px; height:8px; border-radius:50%; background:var(--line); } .qz .dots i.ok{ background:var(--ok);} .qz .dots i.no{ background:var(--bad);}
.toggles{ display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
.toggles button{ border:2px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; font-weight:700; font-size:.9rem; }
.toggles button.on{ color:#1E2557; border-color:var(--ink); }
.vdot text{ font-family:"Commissioner",sans-serif; font-size:13px; paint-order:stroke; stroke:#fff; stroke-width:3px; font-weight:700; fill:#1E2557; }
.scale svg{ width:100%; max-width:440px; display:block; margin:0 auto; }
.scale .beam{ transition:transform .5s cubic-bezier(.3,1.6,.5,1); transform-origin:220px 70px; }
.reasons{ display:grid; gap:6px; margin-top:8px; }
.reason{ display:flex; align-items:center; gap:8px; background:var(--chipbg); border-radius:12px; padding:6px 10px; font-size:.92rem; }
.reason span{ flex:1; }
.reason button{ border:none; background:transparent; font-size:1rem; padding:2px 6px; }
.addrow{ display:grid; gap:8px; grid-template-columns:1fr; }
.addrow input[type=text], .twoin input{ max-width:none; }
.twoin{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
select{ font:inherit; padding:10px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--ink); }
canvas#conf{ position:fixed; inset:0; pointer-events:none; z-index:20; }
.credits{ font-size:.8rem; color:var(--ink2); }

/* ===== v2: cinematic intro, moving train, station arrivals, passport finale ===== */
.metro .train{ position:absolute; top:-7px; width:30px; height:20px; margin-left:-15px; z-index:2; transition:left .9s cubic-bezier(.45,.05,.3,1); pointer-events:none; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.metro .train.back svg{ transform:scaleX(-1); }
.metro .train.moving svg{ animation:bob .18s linear infinite; }
@keyframes bob{ 50%{ transform:translateY(-1.5px);} }
.metro .train.back.moving svg{ animation:bobb .18s linear infinite; }
@keyframes bobb{ 0%,100%{ transform:scaleX(-1);} 50%{ transform:scaleX(-1) translateY(-1.5px);} }

.intro{ position:fixed; inset:0; z-index:40; background:#1E2557; color:#F6F7FF; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px)); overflow:hidden; text-align:center; transition:opacity .6s, transform .6s; }
.intro.out{ opacity:0; transform:scale(1.04); pointer-events:none; }
.intro .sky{ position:absolute; inset:0; pointer-events:none; }
.intro .sky i{ position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; opacity:.0; animation:tw 3s ease-in-out infinite; }
@keyframes tw{ 0%,100%{ opacity:.1;} 50%{ opacity:.8;} }
.intro .eyebrow{ font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:.78rem; color:#FFC93C; opacity:0; animation:fadeUp .7s .2s forwards; position:relative; }
.intro h1{ position:relative; font-size:clamp(2.4rem,11vw,4.6rem); margin:.15em 0 .2em; }
.intro h1 .w{ display:inline-block; opacity:0; transform:translateY(30px) rotate(-4deg); animation:wordIn .7s cubic-bezier(.2,1.4,.4,1) forwards; }
.intro h1 .w:nth-child(1){ animation-delay:2.9s; } .intro h1 .w:nth-child(2){ animation-delay:3.1s; color:#FFC93C; }
@keyframes wordIn{ to{ opacity:1; transform:none; } }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:none; } }
.intro .scene{ position:relative; width:min(100%,560px); }
.intro .scene svg{ width:100%; height:auto; display:block; overflow:visible; }
.intro .tr{ animation:drive 2.8s cubic-bezier(.5,0,.3,1) .4s both; }
@keyframes drive{ from{ transform:translateX(-90px);} to{ transform:translateX(470px);} }

  return `

<p class="lead">Αυτές οι 10 μαλακές δεξιότητες θεωρούνται σήμερα οι κυριότερες. Πάτησε τα <b>3 φύλλα</b> που σου ταιριάζουν περισσότερο.</p>
<div class="tree"><svg viewBox="0 0 560 330" role="group" aria-label="Δέντρο δεξιοτήτων">
  <path d="M280 330 C 270 260, 250 230, 270 170 M270 230 C 220 200, 170 190, 130 150 M272 200 C 330 180, 380 170, 430 160 M268 170 C 260 120, 250 100, 260 95 M270 175 C 300 140, 330 120, 340 110 M268 180 C 220 140, 200 125, 180 120" stroke="#8B5A2B" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M230 330 Q 280 300 330 330" fill="#8B5A2B"/>
  ${SOFT.map((s,i)=>{const [x,y]=pos[i]; return `<g class="leaf ${S.strengths.includes(s)?"on":""}" data-s="${esc(s)}" tabindex="0" role="button" aria-label="${esc(s)}">
    <ellipse cx="${x}" cy="${y}" rx="${Math.max(44,s.length*4.2)}" ry="24" fill="#8FD18B" stroke="#3F8A3B" stroke-width="2"/>
    <text x="${x}" y="${y+4}" text-anchor="middle">${esc(s)}</text></g>`}).join("")}

</svg></div>
<p class="hint" id="pick"></p>`}, el=>{
  const upd=()=>{ $("#pick",el).textContent = S.strengths.length ? `Τα δυνατά σου σημεία: ${S.strengths.join(", ")} (${S.strengths.length}/3)` : "Δεν έχεις διαλέξει ακόμα."; };
  $$(".leaf",el).forEach(g=>{ const f=()=>{ const s=g.dataset.s; if(S.strengths.includes(s)){ S.strengths=S.strengths.filter(x=>x!==s); g.classList.remove("on"); } else if(S.strengths.length<3){ S.strengths.push(s); g.classList.add("on"); } save(); upd(); if(S.strengths.length===3) award("tree",15); };
    g.onclick=f; g.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); f(); } }; });
  upd();
});

  <text x="105" y="105" text-anchor="middle" font-size="17">ΜΠΟΡΩ</text>

  <text x="200" y="302" text-anchor="middle" font-size="17">ΑΞΙΖΕΙ</text>

    `<h3>Ικανότητες & Δεξιότητες = τι ΜΠΟΡΩ</h3><p>Τα «εργαλεία» σου. Κάποιες ικανότητες τις έχουμε από τη φύση, οι δεξιότητες χτίζονται με εξάσκηση.</p>`,
    `<h3>Ενδιαφέροντα = τι ΘΕΛΩ / ΜΟΥ ΑΡΕΣΕΙ</h3><p>Οι δραστηριότητες που μας κάνουν να νιώθουμε καλά. Έχουν ήδη επηρεάσει επιλογές σου και είναι φυσιολογικό να αλλάζουν όσο μεγαλώνεις, με νέες εμπειρίες και την επίδραση του περιβάλλοντος.</p>`,

add(0,"Προβληματισμοί",()=>`
<h2>Τι λες εσύ;</h2>
<p class="lead">Απάντησε πρώτα εσύ. Μετά άνοιξε το πιθανό σενάριο και σύγκρινε.</p>
<div id="dil"></div>`, el=>{

    {q:"Αν ΘΕΛΩ κάτι και του δίνω αξία, μπορώ να το καταφέρω, ακόμα κι αν δεν έχω (ακόμα) τις ικανότητες;",
     a:`<p>Η θέληση μπορεί να γίνει <b>ισχυρός μοχλός</b>, αρκεί οι ικανότητες να υπάρχουν σε κάποιο βαθμό, ίσως «θαμμένες».</p><ol class="steps"><li><b>Θέληση:</b> αγαπά τη μουσική και θαυμάζει τους πιανίστες.</li><li><b>Χωρίς υπόβαθρο:</b> καμία εμπειρία, ούτε καλή αίσθηση ρυθμού.</li><li><b>Επιμονή:</b> εξασκείται με δάσκαλο ή μόνος, μαθαίνει νότες και παρτιτούρες.</li><li><b>Κύκλος:</b> περισσότερη εξάσκηση → περισσότερη επιτυχία → περισσότερη επιθυμία.</li></ol>`},
    {q:"Αν ΜΠΟΡΩ να κάνω κάτι, μπορεί με τον καιρό να αρχίσει να μου αρέσει, ακόμα κι αν αρχικά δεν με ενδιέφερε;",
     a:`<ol class="steps"><li><b>Ικανότητα:</b> δουλεύει στον προγραμματισμό χωρίς ιδιαίτερο ενδιαφέρον, αλλά τα καταφέρνει.</li><li><b>Ανάπτυξη:</b> γίνεται καλός και πετυχαίνει σε νέες προκλήσεις.</li><li><b>Αναδυόμενο ενδιαφέρον:</b> αρχίζει να εκτιμά τον τομέα.</li><li><b>Αναγνώριση:</b> όταν το βλέπουν κι οι άλλοι, το ενδιαφέρον δυναμώνει κι άλλο.</li></ol>`},
    {q:"Αν ΜΠΟΡΩ, ΘΕΛΩ και ΑΞΙΖΕΙ δεν είναι σε ισορροπία, ποιο πρέπει να «τραβήξει» περισσότερο την απόφαση;", opts:["Το ΜΠΟΡΩ","Το ΘΕΛΩ","Το ΑΞΙΖΕΙ","Και τα τρία μαζί"],
     a:`<p>Και τα τρία δουλεύουν μαζί, με όλο τον εαυτό. Σε κάποιες περιπτώσεις όμως το <b>ενδιαφέρον</b> μπορεί να σταθεί πιο δυνατό στην κατεύθυνση της απόφασης.</p>`},
    {q:"Τι πρέπει να κάνω για να βρω ισορροπία ανάμεσα στο ΜΠΟΡΩ, το ΘΕΛΩ και το ΑΞΙΖΕΙ;", write:true,
     a:`<p><b>Αυτογνωσία μέσα από αυτοπαρατήρηση.</b> Σταδιακά συνειδητοποιείς τι κουβαλάς από τη φύση σου και τι αποκτάς από το περιβάλλον, και πώς ταιριάζουν όλα μαζί.</p>`}
  ];
  $("#dil",el).innerHTML=D.map((d,i)=>`<div class="panel" data-i="${i}"><h3>${i+1}. ${d.q}</h3>
   ${d.write?`<label class="hint" for="w${i}">Γράψε τη δική σου απάντηση:</label><textarea class="lined" id="w${i}" rows="4" placeholder="…">${esc(S.notes&&S.notes[i]||"")}</textarea>`:`<div class="vote">${(d.opts||["Ναι","Όχι","Εξαρτάται"]).map(v=>`<button>${v}</button>`).join("")}</div>`}
   <button class="btn alt sm" data-open>Δες ένα πιθανό σενάριο</button><div class="reveal">${d.a}</div></div>`).join("");
  $$(".panel[data-i]",el).forEach(p=>{
    $$(".vote button",p).forEach(b=>b.onclick=()=>{ $$(".vote button",p).forEach(x=>x.classList.remove("on")); b.classList.add("on"); award("vote"+p.dataset.i,3); });
    const ta=$("textarea",p); if(ta) ta.oninput=()=>{ S.notes=S.notes||{}; S.notes[p.dataset.i]=ta.value.slice(0,600); save(); if(ta.value.trim().length>15) award("write"+p.dataset.i,5); };
    $("[data-open]",p).onclick=e=>{ $(".reveal",p).classList.toggle("show"); award("open"+p.dataset.i,2); };
  });
});

add(0,"Το εξάγωνο του Holland",()=>`
<h2>Το εξάγωνο του J. Holland</h2>
<p class="lead">Σύμφωνα με τη θεωρία του Holland, οι άνθρωποι και τα επαγγέλματα μοιάζουν με 6 τύπους. Απάντησε στις 12 προτάσεις και δες ποια γωνία του εξαγώνου «φωτίζεται».</p>
<div class="hex" id="hexwrap"></div>
<div class="panel" id="hq"></div>
<div id="hres"></div>`, el=>{
  const order=["R","I","A","S","E","C"], ang=[-120,-60,0,60,120,180];
  const P=order.map((k,i)=>{ const a=ang[i]*Math.PI/180; return [210+150*Math.cos(a),175+150*Math.sin(a)]; });
  const draw=()=>{
    const sc=score(); const mx=Math.max(4,...Object.values(sc));
    const inner=order.map((k,i)=>{ const f=.12+.88*(sc[k]/mx); return [210+(P[i][0]-210)*f,175+(P[i][1]-175)*f]; });
    let lines=""; for(let a=0;a<6;a++) for(let b=a+1;b<6;b++) lines+=`<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" stroke="var(--line)" stroke-width="1.5"/>`;
    $("#hexwrap",el).innerHTML=`<svg viewBox="-85 0 590 350">${lines}
      <polygon points="${P.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <polygon points="${inner.map(p=>p.join(",")).join(" ")}" fill="#FFC93C" fill-opacity=".65" stroke="#E0A800" stroke-width="2" style="transition:all .3s"/>
      ${order.map((k,i)=>`<circle cx="${P[i][0]}" cy="${P[i][1]}" r="${8+sc[k]*2.2}" fill="${HOLL[k].col}" stroke="var(--ink)" stroke-width="2"/>
      <text x="${P[i][0]+(ang[i]===0?14:ang[i]===180?-14:0)}" y="${P[i][1]+(ang[i]<0?-18:ang[i]>0&&ang[i]<180?28:5)}" text-anchor="${ang[i]===0?"start":ang[i]===180?"end":"middle"}">${HOLL[k].n}</text>`).join("")}
    </svg>`;
    const answered=Object.keys(S.holland).length;
    if(answered>=12){
      const top=order.slice().sort((a,b)=>sc[b]-sc[a]).slice(0,2);
      $("#hres",el).innerHTML=`<div class="panel" style="border-color:var(--ink)"><span class="tag">Οι τύποι που ξεχωρίζουν τώρα</span>
        <h3 style="margin-top:8px">${top.map(t=>HOLL[t].n).join(" + ")}</h3>
        ${top.map(t=>`<p><b>${HOLL[t].n}:</b> ${HOLL[t].d}</p><p class="hint" style="margin:0 0 4px">Κλάδοι που ίσως αξίζει να εξερευνήσεις:</p><div>${HOLL[t].areas.map(j=>`<span class="chip">${j}</span>`).join("")}</div>`).join("<br>")}
        <div class="panel" style="background:var(--chipbg);border:none;margin-top:14px"><b>⚠️ Προσοχή:</b> Αυτό <b>δεν</b> σου λέει τι επάγγελμα να κάνεις. Δείχνει μόνο ποια ενδιαφέροντα ξεχωρίζουν σήμερα, με βάση 12 γρήγορες ερωτήσεις, και μπορεί να αλλάξουν όσο μεγαλώνεις. Χρησιμοποίησέ το ως αφορμή για κουβέντα με την Καθηγήτρια/τον Καθηγητή ΣΕΑ.</div></div>
        <p class="quote">«Έχεις τα πινέλα, έχεις τα χρώματα, ζωγράφισε τον παράδεισο και μπες μέσα.»<br><small>Νίκος Καζαντζάκης</small></p>`;
      award("holland",25);
    } else $("#hres",el).innerHTML=`<p class="hint">Απαντήσεις: ${answered}/12</p>`;
  };
  $("#hq",el).innerHTML=HQ.map((q,i)=>`<div class="qrow"><span>${q[1]}</span><div class="seg" data-q="${i}">${["Όχι","Λίγο","Πολύ"].map((l,v)=>`<button data-v="${v}" class="${S.holland[i]===v?"on":""}">${l}</button>`).join("")}</div></div>`).join("");
  $$(".seg",el).forEach(sg=>$$("button",sg).forEach(b=>b.onclick=()=>{ $$("button",sg).forEach(x=>x.classList.remove("on")); b.classList.add("on"); S.holland[sg.dataset.q]=+b.dataset.v; save(); draw(); }));
  draw();
});
function score(){ const sc={R:0,I:0,A:0,S:0,E:0,C:0}; Object.entries(S.holland).forEach(([i,v])=>{ sc[HQ[i][0]]+=v; }); return sc; }

add(1,"Χάσμα δεξιοτήτων",()=>`
<h2>Χάσμα δεξιοτήτων (skills mismatch)</h2>
<p class="lead">Είναι η διαφορά ανάμεσα σε όσα ζητά ο εργοδότης και σε όσα ξέρει ο εργαζόμενος. Συμβαίνει συνήθως όταν η αγορά αλλάζει πιο γρήγορα απ' ό,τι προλαβαίνουμε να μάθουμε.</p>
<div class="panel">
  <label for="yr"><b>Σύρε τον χρόνο:</b> <span id="yrl">2026</span></label>
  <input type="range" id="yr" min="0" max="10" value="0">
  <label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="ll"> Συνεχίζω να μαθαίνω (διά βίου μάθηση)</label>
  <div class="bars">
    <div class="bar"><i id="b1" style="background:#FF8C98"></i><span>Τι ζητά η αγορά</span></div>
    <div class="bar"><i id="b2" style="background:#7EE0C9"></i><span>Οι δεξιότητές μου</span></div>
  </div>
  <p class="hint" style="margin-top:8px">🔴 Η κόκκινη μπάρα δείχνει πόσα ζητούν οι εργοδότες. 🟢 Η πράσινη δείχνει πόσα ξέρεις εσύ. Η απόσταση ανάμεσά τους είναι το <b>χάσμα δεξιοτήτων</b>. Σύρε τον χρόνο και δες τι γίνεται με και χωρίς διά βίου μάθηση.</p>
  <p class="fb" id="gap"></p>
</div>`, el=>{
  const u=()=>{ const y=+$("#yr",el).value, l=$("#ll",el).checked; const need=40+y*5.5, have=40+y*(l?5.5:1.2);
    $("#b1",el).style.width=need+"%"; $("#b2",el).style.width=have+"%"; $("#yrl",el).textContent=2026+y;
    const g=Math.round(need-have); const f=$("#gap",el); f.className="fb "+(g>8?"no":"ok"); f.textContent=g>8?`Χάσμα: ${g} μονάδες. Χρειάζεται αναβάθμιση δεξιοτήτων!`:"Συμβαδίζεις με την αγορά 👌";
    if(y>=6&&l) award("gap",10); };
  $("#yr",el).oninput=u; $("#ll",el).onchange=u; u();
});

add(1,"Ταξινόμηση επαγγελμάτων",()=>`
<h2>Σε ποια ομάδα ανήκει;</h2>
<p class="lead">Τα επαγγέλματα ταξινομούνται διεθνώς (ISCO-08 του Διεθνούς Γραφείου Εργασίας) σε 10 μεγάλες κατηγορίες, από το 0 ως το 9.</p>
<details><summary>Δες τις 10 κατηγορίες</summary><div class="isco">${ISCO.map(c=>`<b>${c[0]}</b><span>${c[1]}</span>`).join("")}</div></details>
<div class="panel"><h3 id="iq"></h3><div class="opts" id="io"></div><p class="fb" id="ifb"></p></div>`, el=>{
  const qs=shuffle(ISCOQ).slice(0,6); let k=0, ok=0;
  const show=()=>{ $("#ifb",el).textContent="";
    if(k>=qs.length){ $("#iq",el).textContent=`🎉 ${ok}/${qs.length} σωστά!`; $("#io",el).innerHTML=""; award("isco",ok*3); return; }
    const ans=qs[k][1]; const opts=shuffle([ans,...shuffle(ISCO.map(c=>c[0]).filter(c=>c!==ans)).slice(0,3)]);
    $("#iq",el).textContent=`${k+1}. ${qs[k][0]}`;
    $("#io",el).innerHTML=opts.map(o=>`<button data-o="${o}"><b>${o}</b> · ${ISCO[o][1]}</button>`).join("");
    $$("#io button",el).forEach(b=>b.onclick=()=>{ if($("#io",el).dataset.lock) return; $("#io",el).dataset.lock=1;
      const r=b.dataset.o===ans; if(r) ok++; b.classList.add(r?"ok":"no"); if(!r) $(`#io button[data-o="${ans}"]`,el).classList.add("ok");
      setTimeout(()=>{ delete $("#io",el).dataset.lock; k++; show(); },1000); });
  }; show();
});

/* C0 decision scale */
add(2,"Ζυγαριά απόφασης",()=>`
<h2>Η ζυγαριά της απόφασης ⚖️</h2>
<p class="lead">Δύο επιλογές σε απασχολούν (π.χ. 2η ή 3η ΟΜΠ); Γράψε τες, πρόσθεσε λόγους υπέρ και κατά και δες προς τα πού γέρνει η ζυγαριά.</p>
<div class="twoin"><input type="text" id="oa" placeholder="Επιλογή Α"><input type="text" id="ob" placeholder="Επιλογή Β"></div>
<div class="scale panel" style="margin-top:12px"><svg viewBox="0 0 440 220" aria-hidden="true">
  <polygon points="220,70 195,200 245,200" fill="var(--line)"/><rect x="170" y="198" width="100" height="10" rx="5" fill="var(--ink2)"/>
  <g class="beam" id="beam">
    <rect x="40" y="64" width="360" height="12" rx="6" fill="var(--ink)"/>
    <line x1="60" y1="70" x2="60" y2="120" stroke="var(--ink2)" stroke-width="2"/><line x1="380" y1="70" x2="380" y2="120" stroke="var(--ink2)" stroke-width="2"/>
    <path d="M10 120 Q60 160 110 120 Z" fill="#FF8C98"/><path d="M330 120 Q380 160 430 120 Z" fill="#8FB2FF"/>
    <text id="la" x="60" y="108" text-anchor="middle" style="font-family:Comfortaa;font-weight:700;font-size:18px;fill:var(--ink)">Α</text>
    <text id="lb" x="380" y="108" text-anchor="middle" style="font-family:Comfortaa;font-weight:700;font-size:18px;fill:var(--ink)">Β</text>
    <text id="sa" x="60" y="140" text-anchor="middle" style="font-weight:800;font-size:20px;fill:#1E2557">0</text>
    <text id="sb" x="380" y="140" text-anchor="middle" style="font-weight:800;font-size:20px;fill:#1E2557">0</text>
  </g>
  <circle cx="220" cy="70" r="7" fill="var(--sun)" stroke="var(--ink)" stroke-width="2"/>
</svg><p class="fb" id="verdict"></p></div>
<div class="panel"><h3>Πρόσθεσε έναν λόγο</h3>
<div class="addrow"><input type="text" id="rt" placeholder="π.χ. Μου αρέσουν τα Μαθηματικά" maxlength="80">
<div class="toggles" id="rside"><button data-v="a" class="on" style="background:#FF8C98">Για την Α</button><button data-v="b" style="background:#8FB2FF">Για τη Β</button></div>
<div class="toggles" id="rsign"><button data-v="1" class="on" style="background:#9BE7C4">👍 Υπέρ</button><button data-v="-1" style="background:#FFB3BA">👎 Κατά</button></div>
<label class="hint">Πόσο σημαντικό είναι; <select id="rw"><option value="1">Λίγο</option><option value="2" selected>Αρκετά</option><option value="3">Πολύ</option></select></label>
<button class="btn" id="radd">+ Πρόσθεσε</button></div>
<div class="reasons" id="rl"></div></div>
<p class="hint">Η ζυγαριά δεν αποφασίζει για σένα. Σε βοηθά να δεις τι μετράει περισσότερο. Δείξε τη στην Καθηγήτρια/στον Καθηγητή ΣΕΑ ή στην οικογένειά σου.</p>`, el=>{
  S.dec=S.dec||{a:"",b:"",r:[]};
  const oa=$("#oa",el), ob=$("#ob",el); oa.value=S.dec.a; ob.value=S.dec.b;
  let side="a", sign=1;
  const tog=(id,cb)=>$$(`#${id} button`,el).forEach(b=>b.onclick=()=>{ $$(`#${id} button`,el).forEach(x=>x.classList.remove("on")); b.classList.add("on"); cb(b.dataset.v); });
  tog("rside",v=>side=v); tog("rsign",v=>sign=+v);
  const upd=()=>{
    const A=S.dec.a||"Α", B=S.dec.b||"Β";
    $("#la",el).textContent=A.slice(0,14); $("#lb",el).textContent=B.slice(0,14);
    $$("#rside button",el)[0].textContent="Για: "+A; $$("#rside button",el)[1].textContent="Για: "+B;
    let sa=0,sb=0; S.dec.r.forEach(x=>{ const v=x.s*x.w; if(x.side==="a") sa+=v; else sb+=v; });
    $("#sa",el).textContent=sa; $("#sb",el).textContent=sb;
    const tilt=Math.max(-18,Math.min(18,(sb-sa)*3));
    $("#beam",el).style.transform=`rotate(${tilt}deg)`;
    const v=$("#verdict",el);
    v.className="fb"; v.textContent=!S.dec.r.length?"Πρόσθεσε τουλάχιστον έναν λόγο για κάθε επιλογή.":sa===sb?"Ισορροπία! Ίσως χρειάζεσαι περισσότερες πληροφορίες.":`Η ζυγαριά γέρνει προς: ${sa>sb?A:B}`;
    $("#rl",el).innerHTML=S.dec.r.map((x,i)=>`<div class="reason"><b>${x.s>0?"👍":"👎"}</b><span>${esc(x.t)} <small class="hint">(${x.side==="a"?esc(A):esc(B)} · ${"●".repeat(x.w)})</small></span><button data-del="${i}" aria-label="Διαγραφή">✕</button></div>`).join("");
    $$("[data-del]",el).forEach(b=>b.onclick=()=>{ S.dec.r.splice(+b.dataset.del,1); save(); upd(); });
    if(S.dec.r.some(x=>x.side==="a")&&S.dec.r.some(x=>x.side==="b")&&S.dec.r.length>=4) award("scale",15);
  };
  oa.oninput=()=>{ S.dec.a=oa.value.slice(0,30); save(); upd(); };
  ob.oninput=()=>{ S.dec.b=ob.value.slice(0,30); save(); upd(); };
  $("#radd",el).onclick=()=>{ const t=$("#rt",el).value.trim(); if(!t){ $("#rt",el).focus(); return; }
    S.dec.r.push({t:t.slice(0,80), side, s:sign, w:+$("#rw",el).value}); $("#rt",el).value=""; save(); beep("ok"); upd(); };
  $("#rt",el).onkeydown=e=>{ if(e.key==="Enter") $("#radd",el).click(); };
  upd();
});

/* C1 decision + passport */
add(2,"Λήψη απόφασης",()=>{
  const sc=score(); const hasH=Object.keys(S.holland).length>=12;
  const top=hasH?Object.keys(sc).sort((a,b)=>sc[b]-sc[a]).slice(0,2).map(t=>HOLL[t].n).join(" + "):"Δεν ολοκληρώθηκε";
  return `
<h2>Λήψη απόφασης</h2>
<p class="lead">Η ζωή είναι μια σειρά από <b>μεταβάσεις</b>: από το Γυμνάσιο στο Λύκειο, από το σχολείο στις σπουδές, από τις σπουδές στη δουλειά. Κάθε μετάβαση χρειάζεται αποφάσεις, μικρές και μεγάλες. Η Α΄ Λυκείου είναι η πρώτη σου μεγάλη.</p>
<div class="passport" id="pp">
  <h2>Διαβατήριο${S.name?" του/της "+esc(S.name):""} ✈️</h2>
  <div class="row"><small>Τύπος Holland</small>${top}</div>
  <div class="row"><small>Δυνατά σημεία</small>${S.strengths.length?S.strengths.map(s=>`<span class="chip">${esc(s)}</span>`).join(""):"–"}</div>
  <div class="row"><small>Επαγγέλματα του μέλλοντος που μου άρεσαν</small>${S.likes.length?S.likes.map(s=>`<span class="chip">${esc(s)}</span>`).join(""):"–"}</div>
  <div class="row"><small>ΟΜΠ που εξερεύνησα τελευταία</small>${S.omp?`${S.omp}η ΟΜΠ: ${OMP[S.omp-1].sub.join(" + ")} → ${OMP[S.omp-1].k.map(k=>k.replace("K","Κ")).join(", ")}`:"–"}</div>
  ${S.dec&&S.dec.r&&S.dec.r.length?`<div class="row"><small>Η ζυγαριά μου</small>${esc(S.dec.a||"Α")} ⚖️ ${esc(S.dec.b||"Β")}</div>`:""}
  <div class="row"><small>Αστέρια</small>⭐ ${S.xp}</div>
</div>
<div class="panel"><h3>Πριν αποφασίσεις, ρώτα τον εαυτό σου</h3>
<ol class="steps"><li>Ταιριάζει με αυτό που ΜΠΟΡΩ, ΘΕΛΩ και ΜΕΤΡΑΕΙ για μένα;</li><li>Πού οδηγεί; Ποιες κατευθύνσεις και σπουδές μού ανοίγει;</li><li>Μίλησα με την Καθηγήτρια/τον Καθηγητή ΣΕΑ και την οικογένειά μου;</li></ol>
<p class="hint">📚 Κράτα όλα τα βιβλία της ΥΣΕΑ από τη Γ΄ Γυμνασίου ως τη Γ΄ Λυκείου/ΤΕΣΕΚ μέχρι το τέλος του σχολείου.</p></div>
<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sun" id="cel">🎉 Ολοκλήρωσα το ταξίδι</button><button class="btn alt" id="rst">Ξεκίνα από την αρχή</button></div>
${CREDIT}
<details style="margin-top:18px"><summary>Πηγή & συντελεστές</summary><p class="credits">Βασισμένο στην παρουσίαση «Διεργασία της Επαγγελματικής Αγωγής / Συμβουλευτικής, Α΄ Λυκείου» της Υπηρεσίας Συμβουλευτικής και Επαγγελματικής Αγωγής (ΥΣΕΑ), ΥΠΑΝ, Οκτώβριος 2025, και στα βιβλία της ΥΣΕΑ 2025-2026. Σταχυολόγηση: Διαμάντω Ζίζιρου, Κική Μαυρομάτη, Αντιγόνη Καραγιάννη, Βασιλική Λοΐζου. Συμβολή: Στάλω Γιουτανή. Επιμέλεια: Ελένη Παπαστεφάνου. Γενική επιμέλεια: Δρ. Ειρήνη Ροδοσθένους. Οι δραστηριότητες, τα κουίζ και τα παραδείγματα επαγγελμάτων ανά τύπο Holland είναι προσθήκες της διαδραστικής εκδοχής.</p></details>`},
 el=>{
  $("#cel",el).onclick=()=>{ award("finish",20); confetti(); };
  $("#rst",el).onclick=()=>{ if(!confirm("Να σβηστούν οι απαντήσεις και τα αστέρια σου;")) return; Object.assign(S,{i:0,xp:0,done:{},name:"",strengths:[],holland:{},likes:[],omp:null,notes:{},dec:{a:"",b:"",r:[]},venn:[]}); save(); document.getElementById("xp").textContent="⭐ 0"; go(0); };
});

function go(i){

/* --- extra sounds (respect the sound toggle) --- */
function tone(f, t0, dur, type="triangle", vol=.12){
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+dur+.05);
}
function sfx(kind){
  if(!S.sound) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();
    const t=AC.currentTime;
    if(kind==="horn"){ [[392,0],[494,0],[392,.38],[494,.38]].forEach(([f,d])=>tone(f,t+d,.32,"sawtooth",.05)); }
    if(kind==="ding"){ tone(1047,t,.5,"sine",.1); tone(1319,t+.12,.6,"sine",.08); }
    if(kind==="thud"){ const o=AC.createOscillator(), g=AC.createGain(); o.type="sine"; o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(50,t+.18);
      g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.25); }
    if(kind==="fanfare"){ [[523,0],[659,.12],[784,.24],[1047,.4],[784,.58],[1047,.7]].forEach(([f,d],i)=>tone(f,t+d,i>4?.6:.2,"triangle",.11)); }
    if(kind==="chug"){ for(let i=0;i<6;i++) tone(90+((i%2)*20),t+i*.11,.08,"square",.03); }
  }catch(e){}
}

/* ===== v3: narration (Greek text-to-speech) ===== */
const TTS = "speechSynthesis" in window;
const stripEmoji = t => t.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu,"").replace(/\s+/g," ").trim();
function stopSpeak(){ if(TTS){ try{ speechSynthesis.cancel(); }catch(e){} } $$(".speak.on").forEach(b=>{ b.classList.remove("on"); b.querySelector("span").textContent="Άκουσε"; }); }
function greekVoice(){ try{ const v=speechSynthesis.getVoices(); return v.find(x=>/^el(-|_|$)/i.test(x.lang)) || null; }catch(e){ return null; } }
if(TTS){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }
function screenText(main){
  const sc=main.firstElementChild; if(!sc) return "";
  const parts=[];
  const h=$("h1",sc)||$("h2",sc); if(h) parts.push([...h.querySelectorAll("span")].map(s=>s.textContent).join(" ")||h.textContent);
  const lead=$(".lead",sc); if(lead) parts.push(lead.textContent);

function speakScreen(btn, main){

  u.onend=done; u.onerror=done;

}

    <p class="hint note">Ενδεικτικές σπουδές. Πάτησε τις κάρτες Κ πιο κάτω για όλα τα μαθήματα και τις σπουδές κάθε κατεύθυνσης.</p>`;
  requestAnimationFrame(()=>linkGrow(box,!RM));
  if(!RM){ [0,1,2].forEach(i=>setTimeout(()=>sfx("ding"),550+i*350)); }
}
