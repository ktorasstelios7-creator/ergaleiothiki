<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="theme-color" content="#6b3f72">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/favicon.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

</head><body>
<title>Σχολική Διαμεσολάβηση</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Commissioner:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky module rail on the left, one reading column on the right; two "party" hues (A = blue, B = coral) meet at a neutral mediator green. */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --sunk:#eceee9; --line:#d9ddd5;
  --fg:#1d2321; --muted:#5d6762;
  --med:#2f7a62; --med-soft:#dcefe7;
  --a:#3a5fae; --a-soft:#e3e9f7;
  --b:#c4573a; --b-soft:#f8e4dc;
  --warn:#b07a12; --warn-soft:#f7ecd3;
  --display:"Literata",Georgia,"Times New Roman",serif;
  --body:"Commissioner","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1c2220; --sunk:#232b28; --line:#33403b;
  --fg:#e7ece9; --muted:#9caaa4;
  --med:#6cc3a4; --med-soft:#1f3a31;
  --a:#8eaaf0; --a-soft:#232d47;
  --b:#f08f72; --b-soft:#43261d;
  --warn:#e6b54f; --warn-soft:#3b301a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1c2220; --sunk:#232b28; --line:#33403b;
  --fg:#e7ece9; --muted:#9caaa4;
  --med:#6cc3a4; --med-soft:#1f3a31;
  --a:#8eaaf0; --a-soft:#232d47;
  --b:#f08f72; --b-soft:#43261d;
  --warn:#e6b54f; --warn-soft:#3b301a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:700}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--med);outline-offset:2px}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--med)}
.muted{color:var(--muted)}

.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;padding-block:28px 64px}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.05rem;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:.78rem}
.navbtn{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:.92rem;color:var(--muted)}
.navbtn:hover{background:var(--sunk);color:var(--fg)}
.navbtn[aria-current="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.navbtn .n{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.navbtn.done .n{background:var(--med);color:var(--surface)}
.navgroup{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px;font-weight:600}
.progress{margin-top:16px;padding:12px;border-radius:var(--r);background:var(--sunk);font-size:.82rem}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--med);transition:width .3s}
.mobilenav{display:none}

main{min-width:0}
section.mod{display:flex;flex-direction:column;gap:28px}
.lead{font-size:1.1rem;max-width:68ch;color:var(--muted)}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:12px}
.block{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.quote{font-family:var(--display);font-size:1.2rem;line-height:1.5;border-left:3px solid var(--med);padding:4px 0 4px 18px;max-width:62ch}
.quote cite{display:block;font-family:var(--body);font-size:.85rem;font-style:normal;color:var(--muted);margin-top:8px}
.note{background:var(--med-soft);border-radius:var(--r);padding:14px 18px;max-width:68ch}
.warnbox{background:var(--warn-soft);border-radius:var(--r);padding:14px 18px;max-width:68ch}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem}
button.chip:hover{border-color:var(--med)}
button.chip[aria-pressed="true"]{background:var(--med);border-color:var(--med);color:var(--surface)}
.btn{border:1px solid var(--med);background:var(--med);color:var(--surface);border-radius:8px;padding:9px 16px;font-weight:600;font-size:.92rem}
.btn.ghost{background:transparent;color:var(--med)}
.btn:hover{filter:brightness(1.08)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pa{color:var(--a);font-weight:700}.pb{color:var(--b);font-weight:700}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.03em}
.tag.a{background:var(--a-soft);color:var(--a)}.tag.b{background:var(--b-soft);color:var(--b)}.tag.m{background:var(--med-soft);color:var(--med)}.tag.w{background:var(--warn-soft);color:var(--warn)}
.complete{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px;margin-top:8px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
.hero svg{width:100%;height:auto;max-width:420px}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.modcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.modcard:hover{border-color:var(--med)}
.modcard .k{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.modcard b{font-family:var(--display);font-size:1.05rem}
.modcard span{font-size:.88rem;color:var(--muted)}

/* iceberg */
.iceberg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.berg{border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.berg .top{background:var(--b-soft);padding:22px;text-align:center}
.berg .top b{font-family:var(--display);font-size:1.6rem;color:var(--b)}
.berg .under{background:var(--a-soft);padding:18px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:140px}
.berg .under button{border:1px dashed var(--a);background:transparent;color:var(--a);border-radius:999px;padding:6px 14px;font-size:.9rem}
.berg .under button.on{background:var(--a);color:var(--surface);border-style:solid}

/* stepper */
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps button{flex:1 1 140px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;text-align:left;font-size:.88rem}
.steps button[aria-pressed="true"]{border-color:var(--med);background:var(--med-soft)}
.steps button small{display:block;color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--med)}

/* flip */
.flip{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;min-height:130px;display:flex;flex-direction:column;gap:8px}
.flip .back{display:none;color:var(--muted);font-size:.92rem}
.flip.open .back{display:block}
.flip .hint{font-size:.75rem;color:var(--med);font-weight:600;margin-top:auto}

/* curve */
.curvewrap{overflow-x:auto}
.curve{width:100%;min-width:560px;height:auto;display:block}
.curve .pt{cursor:pointer}
.curve .pt circle{transition:r .15s}
.curve .pt:hover circle,.curve .pt.on circle{r:13}
.phase{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.phase h4{margin:0 0 6px;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase}

/* quiz */
.q{display:flex;flex-direction:column;gap:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px}
.opt:hover:not(:disabled){border-color:var(--med)}
.opt.right{border-color:var(--med);background:var(--med-soft)}
.opt.wrong{border-color:var(--b);background:var(--b-soft)}
.opt:disabled{cursor:default}
.fb{font-size:.92rem;padding:10px 14px;border-radius:8px;background:var(--sunk)}

/* practice */
textarea,input[type=text],select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
.speaker{font-family:var(--display);font-size:1.1rem;background:var(--b-soft);border-radius:var(--r);padding:14px 18px}
.model{display:none;background:var(--med-soft);border-radius:8px;padding:12px 16px}
.model.show{display:block}
.imsg{font-family:var(--display);font-size:1.2rem;background:var(--a-soft);border-radius:var(--r);padding:16px 20px;min-height:60px}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}

/* process */
.proc{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px}
.proclist{display:flex;flex-direction:column;gap:4px}
.proclist button{text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px;font-size:.9rem;display:flex;gap:8px;align-items:baseline}
.proclist button span{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:.8rem}
.proclist button[aria-pressed="true"]{background:var(--surface);border-color:var(--line);font-weight:600}
.script{display:flex;flex-direction:column;gap:12px}
.line{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start}
.line .who{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding-top:3px}
.say{font-family:var(--display);font-size:1.08rem}
.order{display:flex;gap:6px;align-items:center;font-size:.85rem}
.tools{display:flex;gap:6px}
.tools span{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--med-soft);color:var(--med)}

/* phrases */
.phr{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.phr:last-child{border-bottom:0}
.phr .t{font-family:var(--display)}
.copy{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;font-size:.78rem;flex:none}

/* scenarios */
.scen{display:flex;flex-direction:column;gap:10px}
.timer{font-variant-numeric:tabular-nums;font-family:var(--display);font-size:3rem;font-weight:700;line-height:1}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.role{border-radius:8px;padding:10px 12px;background:var(--sunk);font-size:.9rem}
.role b{display:block}

/* videos */
.vid{display:flex;flex-direction:column;gap:10px}
.vid .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted)}
.vid code{font-size:.78rem;background:var(--sunk);padding:2px 6px;border-radius:4px;word-break:break-all}

/* forms */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:28px;display:flex;flex-direction:column;gap:16px;max-width:760px}
.paper h3{text-align:center;letter-spacing:.06em;text-transform:uppercase;font-size:1rem}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem}
.checks label{display:flex;gap:6px;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.88rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:16px 48px}
  nav.rail{display:none}
  .mobilenav{display:flex;flex-direction:column;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5;border-bottom:1px solid var(--line)}
  .hero,.iceberg,.proc{grid-template-columns:minmax(0,1fr)}
  .hero svg{max-width:300px}
  .line{grid-template-columns:minmax(0,1fr);gap:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Ενότητες"></nav>
  <main>
    <div class="mobilenav">
      <label class="f" for="mobsel">Ενότητα</label>
      <select id="mobsel"></select>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- Δεδομένα ---------- */
const MODS=[
 {id:"arxi",g:"Ξεκίνημα",t:"Καλώς ήρθατε",d:"Τι περιέχει το εγχειρίδιο και πώς να το χρησιμοποιήσετε"},
 {id:"orismos",g:"Μέρος Α · Θυμός & σύγκρουση",t:"Τι είναι η διαμεσολάβηση",d:"Ορισμός, στόχοι, αποκαταστατική δικαιοσύνη"},
 {id:"thymos",g:"Μέρος Α · Θυμός & σύγκρουση",t:"Κατανοώντας τον θυμό",d:"Τι κρύβεται πίσω του, πώς λειτουργεί, τρεις θεωρίες"},
 {id:"kyklos",g:"Μέρος Α · Θυμός & σύγκρουση",t:"Ο κύκλος της κλιμάκωσης",d:"Επτά φάσεις και τι κάνουμε σε καθεμία"},
 {id:"apoklimakosi",g:"Μέρος Α · Θυμός & σύγκρουση",t:"Αποκλιμάκωση στην τάξη",d:"Τα ναι, τα όχι, το «ταίριασμα στη διάθεση»"},
 {id:"dexiotites",g:"Μέρος Β · Διαμεσολάβηση",t:"Δεξιότητες επικοινωνίας",d:"Ενεργητική ακρόαση, αντανάκλαση, μηνύματα «εγώ»"},
 {id:"arxes",g:"Μέρος Β · Διαμεσολάβηση",t:"Αρχές επίλυσης συγκρούσεων",d:"Συμφέροντα αντί για θέσεις, λύση με κέρδος για όλους"},
 {id:"diadikasia",g:"Μέρος Β · Διαμεσολάβηση",t:"Η διαδικασία βήμα προς βήμα",d:"Το σενάριο των δύο διαμεσολαβητών"},
 {id:"frasies",g:"Εργαλεία",t:"Τράπεζα φράσεων",d:"Ερωτήσεις και επαναδιατυπώσεις έτοιμες για χρήση"},
 {id:"senaria",g:"Εργαλεία",t:"Παιχνίδι ρόλων",d:"Σενάρια, ρόλοι, χρονόμετρο, ανατροφοδότηση"},
 {id:"askiseis",g:"Εργαλεία",t:"Ασκήσεις ομάδας",d:"Γνωριμία, μη λεκτική επικοινωνία, κλείσιμο"},
 {id:"video",g:"Εργαλεία",t:"Βιντεοθήκη",d:"Πότε δείχνουμε κάθε βίντεο και τι συζητάμε"},
 {id:"entypa",g:"Εργαλεία",t:"Έντυπα",d:"Αίτημα και συμβόλαιο διαμεσολάβησης"},
 {id:"quiz",g:"Αξιολόγηση",t:"Τελικό κουίζ",d:"Ελέγξτε τι μάθατε"}
];

const store={get(k,d){try{const v=localStorage.getItem("dm:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem("dm:"+k,JSON.stringify(v))}catch(e){}}};
let done=new Set(store.get("done",[]));
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1600)}
function copyText(txt,el){
  const ok=()=>toast("Αντιγράφηκε");
  try{navigator.clipboard.writeText(txt).then(ok,()=>fallback())}catch(e){fallback()}
  function fallback(){if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Επιλέχθηκε · πατήστε Αντιγραφή")}}
}

/* ---------- Πλοήγηση ---------- */
function renderNav(cur){
  let html=`<div class="brand">${logo(34)}<div><b>Σχολική Διαμεσολάβηση</b><small>Εγχειρίδιο εκπαίδευσης</small></div></div>`;
  let g="";
  MODS.forEach((m,i)=>{
    if(m.g!==g){g=m.g;html+=`<div class="navgroup">${esc(g)}</div>`}
    html+=`<button class="navbtn ${done.has(m.id)?"done":""}" data-go="${m.id}" aria-current="${m.id===cur}"><span class="n">${done.has(m.id)?"✓":i}</span>${esc(m.t)}</button>`;
  });
  const pct=Math.round(done.size/MODS.length*100);
  html+=`<div class="progress">Πρόοδος: <b>${done.size}</b> από ${MODS.length} ενότητες<div class="bar"><i style="width:${pct}%"></i></div></div>`;
  $("#rail").innerHTML=html;
  $("#mobsel").innerHTML=MODS.map((m,i)=>`<option value="${m.id}" ${m.id===cur?"selected":""}>${i}. ${esc(m.t)}${done.has(m.id)?" ✓":""}</option>`).join("");
}
function go(id){
  if(!MODS.find(m=>m.id===id))id="arxi";
  renderNav(id);
  $("#view").innerHTML=VIEWS[id]();
  if(INIT[id])INIT[id]();
  attachComplete(id);
  try{history.replaceState(null,"","#"+id)}catch(e){}
  store.set("last",id);
  window.scrollTo({top:0});
}
function completeBar(id){
  const i=MODS.findIndex(m=>m.id===id),next=MODS[i+1];
  return `<div class="complete"><button class="btn ${done.has(id)?"ghost":""}" id="markdone">${done.has(id)?"✓ Ολοκληρώθηκε":"Σημείωση ως ολοκληρωμένη"}</button>${next?`<button class="btn ghost" data-go="${next.id}">Επόμενο: ${esc(next.t)} →</button>`:""}</div>`;
}
function attachComplete(id){
  const b=$("#markdone");if(!b)return;
  b.onclick=()=>{done.has(id)?done.delete(id):done.add(id);store.set("done",[...done]);go(id)};
}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){e.preventDefault();go(g.dataset.go)}});
$("#mobsel").addEventListener("change",e=>go(e.target.value));

function logo(s){return `<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><circle cx="13" cy="20" r="10" fill="var(--a)" opacity=".85"/><circle cx="27" cy="20" r="10" fill="var(--b)" opacity=".85"/><path d="M20 12.7a10 10 0 0 1 0 14.6a10 10 0 0 1 0-14.6z" fill="var(--med)"/></svg>`}
function head(id,extra=""){const i=MODS.findIndex(m=>m.id===id),m=MODS[i];return `<header class="block"><div class="eyebrow">${esc(m.g)} · Ενότητα ${i}</div><h1>${esc(m.t)}</h1>${extra}</header>`}

/* ---------- Ενότητες ---------- */
const VIEWS={},INIT={};

VIEWS.arxi=()=>`<section class="mod">
 <div class="hero">
  <div class="block">

   <text x="160" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="var(--med)">ΚΟΙΝΟ</text>
   <text x="160" y="121" text-anchor="middle" font-size="11" font-weight="700" fill="var(--med)">ΕΔΑΦΟΣ</text>
   <text x="160" y="206" text-anchor="middle" font-size="12" fill="var(--muted)">Ο διαμεσολαβητής ελέγχει τη διαδικασία</text>
   <text x="160" y="222" text-anchor="middle" font-size="12" fill="var(--muted)">τα μέρη ελέγχουν τη λύση</text>

 </div>
 <div class="block"><h2>Οι ενότητες</h2>
 <div class="modgrid">${MODS.slice(1).map((m,i)=>`<button class="modcard" data-go="${m.id}"><span class="k">${i+1} · ${esc(m.g)}${done.has(m.id)?" · ✓":""}</span><b>${esc(m.t)}</b><span>${esc(m.d)}</span></button>`).join("")}</div></div>

  <div class="card"><h3>Μέρος Β</h3><p class="muted">Βιωματική εκπαίδευση: ενσυναίσθηση, αυτοέλεγχος, αλληλοσεβασμός, υπευθυνότητα, υπομονή, αμεροληψία.</p></div>
  <div class="card"><h3>Πρακτική</h3><p class="muted">Εξάσκηση στη διαδικασία με παιχνίδι ρόλων σε ομάδες των 5–6, με παρατηρητές και ανατροφοδότηση.</p></div>
 </div>
 <p class="muted" style="font-size:.85rem">Η πρόοδός σας αποθηκεύεται μόνο σε αυτόν τον browser.</p>
</section>`;

VIEWS.orismos=()=>`<section class="mod">${head("orismos",`<p class="lead">Πριν από τις τεχνικές, ας συμφωνήσουμε τι εννοούμε όταν λέμε «σχολική διαμεσολάβηση» και τι επιδιώκουμε με αυτήν.</p>`)}
 <blockquote class="quote" style="margin:0">Η διαδικασία ειρηνικής επίλυσης μιας σύγκρουσης, στο πλαίσιο της σχολικής ζωής, μεταξύ δύο ή περισσότερων διαφωνούντων με τη βοήθεια τρίτου, του διαμεσολαβητή.<cite>Βάσω Αρτινοπούλου, 2010</cite></blockquote>
 <div class="grid g2">
  <div class="card"><div class="eyebrow">Μέσα από</div><ul class="clean" style="margin-top:8px"><li>μια δομημένη διαδικασία με σαφή όρια</li><li>ενεργητική συμμετοχή και άμεση επικοινωνία των μερών</li></ul></div>
  <div class="card"><div class="eyebrow">Με σκοπό</div><ul class="clean" style="margin-top:8px"><li>μια εποικοδομητική επίλυση της διαφωνίας</li><li>με μέγιστο κέρδος και για τα δύο μέρη</li></ul></div>
 </div>
 <div class="block"><h2>Τι πετυχαίνει η εκπαίδευση στη διαμεσολάβηση</h2>
 <p class="muted">Βοηθά μαθητές και εκπαιδευτικούς να κατανοήσουν τη φύση της σύγκρουσης και στοχεύει (Jones, 2004):</p>
 <div class="grid g3">
  <div class="card"><b>Ασφαλές περιβάλλον</b><p class="muted">Ένα ασφαλές και εποικοδομητικό περιβάλλον μάθησης.</p></div>
  <div class="card"><b>Ανάπτυξη</b><p class="muted">Κοινωνική και συναισθηματική ανάπτυξη όλων των εμπλεκομένων.</p></div>
  <div class="card"><b>Κοινότητα</b><p class="muted">Μια κοινότητα όπου οι συγκρούσεις είναι μέρος της υγιούς ανάπτυξης.</p></div>
 </div></div>
 <div class="block"><h2>Διαμεσολάβηση και αποκαταστατική δικαιοσύνη</h2>
 <p class="prose">Η αποκαταστατική δικαιοσύνη (Restorative Justice) δεν σταματά στην τιμωρία. Η διαμεσολάβηση είναι το εργαλείο της (Karp & Breslin, 2001). Πατήστε κάθε στόχο:</p>
 <div class="grid g3" id="rj"></div></div>
 <div class="block"><h2>Τρεις βασικοί κανόνες της διαδικασίας</h2>
 <div class="grid g3">
  <div class="card"><span class="tag m">ΟΥΔΕΤΕΡΟΤΗΤΑ</span><p style="margin-top:8px">Ο διαμεσολαβητής μένει ουδέτερος και φροντίζει τις ισορροπίες. Προετοιμάζεται μέσα από εκπαίδευση, πρακτική εξάσκηση και εποπτεία.</p></div>
  <div class="card"><span class="tag a">ΕΛΕΓΧΟΣ</span><p style="margin-top:8px">Ο διαμεσολαβητής ελέγχει τη <b>διαδικασία</b>. Τα μέρη ελέγχουν το <b>αποτέλεσμα</b>. Μόνο λύσεις που προτείνουν τα ίδια τα μέρη εφαρμόζονται πραγματικά.</p></div>
  <div class="card"><span class="tag b">ΕΘΕΛΟΝΤΙΚΗ ΣΥΜΜΕΤΟΧΗ</span><p style="margin-top:8px">Αν τα μέρη δεν δεχτούν, ακολουθείται η συνηθισμένη διαδικασία του σχολείου.</p></div>
 </div></div>
 ${completeBar("orismos")}</section>`;
INIT.orismos=()=>{
 const items=[["Ο δράστης","Διευθέτηση της συμπεριφοράς του θύτη/δράστη: αναλαμβάνει ευθύνη αντί απλώς να τιμωρείται."],["Το θύμα","Αποκατάσταση της βλάβης και του θύματος: ακούγεται τι έπαθε και τι χρειάζεται."],["Η σχέση","Επανόρθωση των σχέσεων και της επικοινωνίας των ατόμων, ώστε να συνυπάρχουν ξανά στο σχολείο."]];
 $("#rj").innerHTML=items.map(([a,b])=>`<button class="flip"><b>${a}</b><span class="back">${b}</span><span class="hint">Πατήστε για να δείτε</span></button>`).join("");
 $("#rj").querySelectorAll(".flip").forEach(f=>f.onclick=()=>f.classList.toggle("open"));
};

VIEWS.thymos=()=>`<section class="mod">${head("thymos",`<p class="lead">Ο θυμός είναι φυσιολογικό συναίσθημα. Το ζητούμενο είναι να τον καταλαβαίνουμε, σε εμάς και στους μαθητές μας, πριν γίνει έκρηξη.</p>`)}
 <blockquote class="quote" style="margin:0">«Οποιοσδήποτε μπορεί να θυμώσει· είναι πολύ εύκολο. Αλλά το να είσαι θυμωμένος με το σωστό άτομο, στον σωστό βαθμό, τη σωστή ώρα, για τον σωστό λόγο και με τον σωστό τρόπο, αυτό είναι το δύσκολο.»<cite>Αριστοτέλης</cite></blockquote>

 <div class="block"><h2>Τι κρύβεται κάτω από τον θυμό;</h2>
 <div class="iceberg">
  <div class="berg"><div class="top"><b>ΘΥΜΟΣ</b><p class="muted" style="font-size:.85rem">αυτό που βλέπουμε</p></div>
   <div class="under" id="berg"></div></div>
  <div class="prose"><p>Ο θυμός θεωρείται <b>δευτερεύον συναίσθημα</b>. Από κάτω βρίσκονται άλλα, πιο ευάλωτα συναισθήματα. Πατήστε τα για να τα φέρετε στην επιφάνεια.</p>
  <div class="note"><b>Θυμός = απειλή.</b> Συνοπτικά, αυτό που νιώθουμε όταν θυμώνουμε είναι ότι κάτι μας απειλεί.</div>
  <p class="muted">Σπάνια πίσω από τον συστηματικό θυμό υπάρχουν συναισθηματικές διαταραχές ή διαταραχές προσωπικότητας. Τότε χρειάζεται ειδική αντιμετώπιση.</p></div>
 </div></div>

 <div class="block"><h2>Ο θυμός ως πυροτέχνημα</h2>
 <p class="muted">Fiendler & Ecton, 1986. Δείτε τα τρία στάδια:</p>
 <div class="steps" id="fw"></div>
 <div class="card" id="fwout"></div>
 <p class="prose">Μια άλλη εικόνα είναι η <b>θύελλα</b>: χρειάζονται συγκεκριμένες συνθήκες για να ξεσπάσει, αλλά μπορούμε να μάθουμε να διαβάζουμε τις ενδείξεις και να προστατευτούμε. Μερικές φορές ξεσπά απότομα, γι' αυτό πρέπει να ξέρουμε πώς να την αντιμετωπίσουμε.</p>
 <div class="card"><div class="eyebrow">Ενδείξεις ότι έρχεται ξέσπασμα</div><div class="chips" style="margin-top:10px">${["Ένταση της φωνής","Βλέμμα","Έκφραση προσώπου","Στάση του σώματος","Κινητικότητα","Συσπείρωση ομάδων"].map(x=>`<span class="chip">${x}</span>`).join("")}</div></div>
 </div>

 <div class="block"><h2>Τι συμβαίνει στο σώμα</h2>
 <div class="grid g2">
  <div class="card"><ul class="clean"><li>Σφιγμένο στομάχι, εφίδρωση</li><li>Κόκκινο και μετά χλωμό πρόσωπο</li><li>Τεντωμένοι μύες</li><li>Γρήγορη αναπνοή, γρήγοροι παλμοί, αυξημένη πίεση</li><li>Διεσταλμένες κόρες ματιών</li><li>Μικρές, έντονες, γρήγορες κινήσεις</li></ul></div>
  <div class="prose"><p>Ο εγκέφαλος στέλνει μήνυμα και η αδρεναλίνη ετοιμάζει το σώμα για μάχη. Το αίμα φεύγει από το στομάχι και το πρόσωπο προς τους μύες. Αυτό βοηθά αν παλεύουμε με θηρία ή τρέχουμε σε αγώνα.</p><p>Σε όλες τις άλλες περιπτώσεις <b>ο συστηματικός θυμός φθείρει το σώμα</b>. Όσο πιο συχνά θυμώνουμε, τόσο πιο εύκολα θυμώνουμε ξανά, και μετά από κάθε ξέσπασμα ακολουθούν κενό, ενοχή και υπερευαισθησία.</p></div>
 </div></div>

 <div class="block"><h2>Τρεις θεωρίες, τρεις φακοί</h2>
 <div class="tabs" role="tablist" id="thtabs"></div>
 <div class="card" id="thout"></div></div>

 <div class="block"><h2>Γνωσιακά λάθη που πυροδοτούν θυμό</h2>
 <p class="muted">Κατά τον Aaron Beck. Πατήστε κάθε κάρτα για ένα σχολικό παράδειγμα.</p>
 <div class="grid g2" id="cog"></div>
 <div class="note"><b>Παράδειγμα:</b> Ένας γνωστός περνά δίπλα μας και δεν μας χαιρετά. «Με αγνόησε επίτηδες» ή «Δεν με είδε»; Η ερμηνεία, όχι το γεγονός, ορίζει πόσος θυμός θα ακολουθήσει. Η διαμεσολάβηση δουλεύει ακριβώς εδώ: κάθε πλευρά ακούει την ιστορία της άλλης και βλέπει πού έκανε λάθος η δική της ερμηνεία.</div>
 </div>

 <div class="block"><h2>Θυμός: φίλος ή εχθρός;</h2>
 <div class="grid g2">
  <div class="card"><span class="tag m">ΕΠΟΙΚΟΔΟΜΗΤΙΚΟΣ</span><p style="margin-top:8px">Ο φυσιολογικός θυμός μάς κινητοποιεί να βρούμε λύσεις. Μπορεί επίσης να λειτουργήσει ως κάθαρση για μαζεμένα συναισθήματα απελπισίας και αβοηθητότητας.</p></div>
  <div class="card"><span class="tag b">ΚΑΤΑΣΤΡΟΦΙΚΟΣ</span><p style="margin-top:8px">Ο προβληματικός θυμός δημιουργεί προβλήματα αντί να τα λύνει. Φέρνει άμεσο αποτέλεσμα, αλλά μακροπρόθεσμα το κόστος είναι τεράστιο.</p></div>
 </div>
 <p class="muted">Η «πίτα του θυμού» του Potter-Efron: τομείς της ζωής που επηρεάζονται.</p>
 <div class="chips">${["Υγεία: σωματική, συναισθηματική, πνευματική","Οικογένεια","Σχολείο","Φίλοι & συνομήλικοι","Νόμος","Οικονομικά","Σύστημα αξιών"].map(x=>`<span class="chip">${x}</span>`).join("")}</div>
 <div class="grid g2">
  <div class="card"><b>Οικογένεια</b><p class="muted">Θυμωμένοι γονείς έχουν θυμωμένα παιδιά, που γίνονται οι επόμενοι θυμωμένοι γονείς. Δεν απαντάμε στον θυμό του παιδιού με ίσο ή μεγαλύτερο θυμό, ούτε υποτασσόμαστε σε αυτόν.</p></div>
  <div class="card"><b>Συνομήλικοι</b><p class="muted">Όσο καλύτερα συναναστρέφεται ένα παιδί με συνομηλίκους, τόσο καλύτερες σχέσεις θα έχει αργότερα. Οι δυσκολίες φαίνονται ήδη από το νηπιαγωγείο.</p></div>
 </div></div>

 <div class="block"><h2>Ποιες ανάγκες προσπαθεί να καλύψει;</h2>
 <p class="muted">Βασικές ανθρώπινες ανάγκες κατά τον Glasser (1986). Όποιος δεν ελέγχει τον θυμό του θα προσπαθήσει να τις καλύψει παραβιάζοντας κανόνες ή δικαιώματα άλλων (Maslow, 1968).</p>
 <div class="grid g3">${[["Επιβίωση","και αναπαραγωγή"],["Αγάπη","και αίσθημα του ανήκειν"],["Δύναμη","αναγνώριση, αξία"],["Ελευθερία","επιλογή, αυτονομία"],["Διασκέδαση","χαρά, μάθηση"]].map(([a,b])=>`<div class="card"><b>${a}</b><p class="muted">${b}</p></div>`).join("")}</div>
 </div>
 <div class="note"><b>Περίληψη.</b> Τρεις παράγοντες στον θυμό: <b>σκέψη, συναίσθημα, συμπεριφορά</b>. Τρία μοντέλα ερμηνείας: <b>συμπεριφορικό, ψυχοδυναμικό, γνωσιοσυμπεριφορικό</b>.</div>
 ${completeBar("thymos")}</section>`;
INIT.thymos=()=>{
 const em=["φόβος","ντροπή","απογοήτευση","τραύμα","εκμετάλλευση","ζήλια","απώλεια"];
 $("#berg").innerHTML=em.map(e=>`<button>${e}</button>`).join("");
 $("#berg").querySelectorAll("button").forEach(b=>b.onclick=()=>b.classList.toggle("on"));
 const fw=[["Σπίρτο","Ο πυροδότης","Ένα γεγονός: μια παρατήρηση, μια κοροϊδία, ένα «όχι». Ερώτηση για εμάς: τι μας πυροδοτεί; Μπορούμε να μάθουμε να το εντοπίζουμε νωρίς;"],["Φυτίλι","Το μυαλό","Σκέψεις και συναισθήματα: «Με έχει στο μάτι», «Δεν είναι δίκαιο». Εδώ μπορεί ακόμη να σβήσει η φλόγα, αν αλλάξει η ερμηνεία."],["Έκρηξη","Σώμα και συμπεριφορά","Το σώμα ετοιμάζεται για μάχη και η συμπεριφορά παίρνει τη μορφή πυροτεχνήματος σε έκρηξη."]];
 const show=i=>{$("#fw").querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-pressed",i===j));$("#fwout").innerHTML=`<h3>${fw[i][0]}: ${fw[i][1]}</h3><p style="margin-top:6px">${fw[i][2]}</p>`};
 $("#fw").innerHTML=fw.map((f,i)=>`<button><small>Στάδιο ${i+1}</small>${f[0]}</button>`).join("");
 $("#fw").querySelectorAll("button").forEach((b,i)=>b.onclick=()=>show(i));show(0);
 const th=[["Συμπεριφορισμός","Οι αντιδράσεις μας διαμορφώνονται από τις θετικές και αρνητικές εμπειρίες που ζήσαμε, κυρίως σε μικρή ηλικία. Για να αλλάξει μια συμπεριφορά, πρώτα εξηγούμε τι αναμένεται και διδάσκουμε πώς επιτυγχάνεται. Μετά ενισχύουμε θετικά (για να διατηρηθεί) ή αρνητικά (για να εξαλειφθεί).","<b>Πριν από κάθε παρέμβαση ρωτάμε:</b> 1. Τι γνωρίζει το άτομο; 2. Τι χρειάζεται να γνωρίζει; 3. Πώς θα το εφαρμόσει;<br><br>Γι' αυτό χρειάζεται κοινός κώδικας συμπεριφοράς στο σχολείο: δεν εννοούμε όλοι το ίδιο όταν λέμε «μιλάμε με σεβασμό»."],["Ψυχοδυναμική","Το συναίσθημα καθορίζει τη συμπεριφορά. Ο θυμός βοηθά το άτομο να λειτουργεί, να προστατεύεται και να αμύνεται.","<b>Μετατόπιση:</b> ένα παιδί που ζει με βίαιο πατέρα στρέφει τον θυμό του σε άλλους ως άμυνα.<br><b>Προβολή:</b> θυμώνουμε με κάποιον χωρίς φανερή αιτία, γιατί μας θυμίζει κάποιον άλλο (π.χ. θυμός προς πρόσωπα εξουσίας).<br><br>Οι μαθητές βλέπουν το σχολείο σαν μια άλλη οικογένεια: μετρούν αποδοχή, ασφάλεια και αυταξία, και αντιδρούν ανάλογα. Όλοι χρειάζεται να νιώθουν ότι ανήκουν."],["Γνωσιοσυμπεριφορισμός","Η σκέψη καθορίζει το συναίσθημα και τη συμπεριφορά. Όποιος μάθει να παρατηρεί τον τρόπο που σκέφτεται μπορεί να αλλάξει και το πώς νιώθει και πώς φέρεται.","Κάθε γεγονός περνά από μια υποκειμενική «μετάφραση» που μπορεί να έχει λάθη: τα <b>γνωσιακά λάθη</b>.<br><br>Παράδειγμα: «Ο καθηγητής μού μίλησε απότομα». Πρώτη αντίδραση: να του επιτεθώ. Εναλλακτικά, μαθαίνω να σκέφτομαι γρήγορα άλλες ερμηνείες και να μη βγάζω αυθαίρετα συμπεράσματα."]];
 const tshow=i=>{$("#thtabs").querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-selected",i===j));$("#thout").innerHTML=`<div class="grid g2"><div class="prose"><h3>${th[i][0]}</h3><p>${th[i][1]}</p></div><div class="note">${th[i][2]}</div></div>`};
 $("#thtabs").innerHTML=th.map(t=>`<button role="tab">${t[0]}</button>`).join("");
 $("#thtabs").querySelectorAll("button").forEach((b,i)=>b.onclick=()=>tshow(i));tshow(0);

INIT.apoklimakosi=()=>{
 const r=$("#mood"),stu=[[0,40],[60,30],[120,20],[180,15],[240,25],[300,50],[360,80],[420,100],[490,110]];
 const draw=()=>{const v=+r.value/100;
  const sp=stu.map(([x,y])=>`${x+5},${y}`).join(" L");
  $("#stuLine").setAttribute("d","M"+sp);
  const tch=stu.map(([x,y],i)=>{const k=i/(stu.length-1);let ty;if(k<=v){const gap=20+40*k;ty=Math.min(120,y+gap)}else{ty=null}return ty==null?null:`${x+5},${ty}`}).filter(Boolean);
  $("#tchLine").setAttribute("d",tch.length?"M"+tch.join(" L"):"");
  $("#moodtxt").textContent=v<.3?"Στην αρχή: δείχνουμε ότι το παίρνουμε στα σοβαρά, με λίγη ένταση στη φωνή, πάντα κάτω από το επίπεδο του μαθητή.":v<.7?"Στη συνέχεια: χαμηλώνουμε σταδιακά φωνή και ρυθμό. Ο μαθητής μάς ακολουθεί προς τα κάτω.":"Στο τέλος: ήρεμο πρόσωπο, χαμηλή φωνή. Τώρα μπορεί να ξεκινήσει η επικοινωνία."};
 r.oninput=draw;r.value=100;draw();
 const ph=[["«Θα δεις τι θα πάθεις!»","Ε"],["«Κάνε ό,τι νομίζεις…»","Π"],["«Αισθάνομαι θυμό όταν μου μιλάς άσχημα.»","Δ"],["«Εσύ φταις για όλα!»","Ε"],["«Σιγά το πράγμα… ποιος νοιάζεται;»","Π"],["«Δεν εκτιμώ τα σχόλιά σου. Με μειώνουν. Αν υπάρχει πρόβλημα, ας το συζητήσουμε.»","Δ"],["«Πάντα κάνεις αυτό…»","Ε"],["«Σου ζήτησα να σταματήσεις!»","Δ"],["«Ούτως ή άλλως δεν ήθελα…»","Π"]];
 const L={Ε:"Επιθετικό",Π:"Παθητικο-επιθετικό",Δ:"Διεκδικητικό"};let score=0,ans=0;
 $("#styles").innerHTML=ph.map(([p],i)=>`<div class="card row" style="justify-content:space-between" data-i="${i}"><span class="say" style="min-width:0;flex:1 1 240px">${p}</span><span class="row">${Object.keys(L).map(k=>`<button class="chip" data-k="${k}">${L[k]}</button>`).join("")}</span></div>`).join("");
 $("#styles").querySelectorAll(".card").forEach(c=>{const i=+c.dataset.i;c.querySelectorAll("button").forEach(b=>b.onclick=()=>{
  if(c.dataset.done)return;c.dataset.done=1;ans++;const ok=b.dataset.k===ph[i][1];if(ok)score++;
  b.setAttribute("aria-pressed","true");if(!ok){b.style.background="var(--b)";b.style.borderColor="var(--b)";b.style.color="var(--surface)";c.querySelector(`[data-k="${ph[i][1]}"]`).style.borderColor="var(--med)"}
  $("#stscore").textContent=`Σωστές: ${score} από ${ans}${ans===ph.length?" · Ολοκληρώθηκε":""}`})});
};

  $("#plist").querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-pressed",i===j));
  const ord=s.ord?`<div class="order"><span class="muted">Σειρά:</span>${s.ord==="ab"?`<span class="tag a">Α</span>→<span class="tag b">Β</span>`:`<span class="tag b">Β</span>→<span class="tag a">Α</span>`}</div>`:"";
  const tools=s.tools?`<div class="row"><span class="muted" style="font-size:.85rem">Εργαλεία:</span><div class="tools">${[...s.tools].map(t=>`<span>${t}</span>`).join("")}</div></div>`:"";
  $("#pout").innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">${i===0?"Πριν τη συνάντηση":"Στάδιο "+i+" από "+(STEPS.length-1)}</div><h2>${s.t}</h2></div>${ord}</div>${tools}
  ${s.lines.map(([w,t])=>`<div class="line"><span class="who" style="color:${w.includes("2")?"var(--b)":"var(--a)"}">${w}</span><span class="${t.startsWith("«")?"say":""}">${t}</span></div>`).join("")}
  ${s.tip?`<div class="note">${s.tip}</div>`:""}
  <div class="row" style="justify-content:space-between;margin-top:6px"><button class="btn ghost" ${i===0?"disabled":""} id="pp">← Προηγούμενο</button><button class="btn" ${i===STEPS.length-1?"disabled":""} id="pn">Επόμενο →</button></div>`;
  $("#pp").onclick=()=>show(i-1);$("#pn").onclick=()=>show(i+1)};
 $("#plist").innerHTML=STEPS.map((s,i)=>`<button><span>${i===0?"·":i}</span>${s.t}</button>`).join("");
 $("#plist").querySelectorAll("button").forEach((b,i)=>b.onclick=()=>show(i));show(0);
 const cl=["Ενημέρωσα και τα δύο μέρη και πήρα τη συναίνεσή τους","Είπα τους κανόνες και ρώτησα αν συμφωνούν","Άκουσα και τις δύο ιστορίες χωρίς να κρίνω","Έκανα περίληψη μετά από κάθε τοποθέτηση","Αντανακλούσα τα συναισθήματα","Οι λύσεις προτάθηκαν από τα μέρη, όχι από εμένα","Η συμφωνία είναι συγκεκριμένη: ποιος, τι, πότε","Ορίσαμε συνάντηση παρακολούθησης σε μία εβδομάδα"];
 const st=store.get("chk",{});
 $("#chk").innerHTML=cl.map((c,i)=>`<label class="row" style="gap:10px"><input type="checkbox" id="ck${i}" ${st[i]?"checked":""} style="width:18px;height:18px;accent-color:var(--med)"> ${c}</label>`).join("");
 cl.forEach((_,i)=>$("#ck"+i).onchange=e=>{st[i]=e.target.checked;store.set("chk",st)});
};

INIT.frasies=()=>{
 const cats=["Όλες",...new Set(PHRASES.map(p=>p[0]))];let cur="Όλες";
 const rend=()=>{const q=$("#psearch").value.trim().toLowerCase();
  const L=PHRASES.filter(p=>(cur==="Όλες"||p[0]===cur)&&p[1].toLowerCase().includes(q));
  $("#plist2").innerHTML=L.length?L.map(p=>`<div class="phr"><div style="min-width:0"><span class="tag m">${p[0]}</span> <span class="t">${p[1]}</span></div><button class="copy">Αντιγραφή</button></div>`).join(""):`<p class="muted" style="padding:16px">Καμία φράση δεν ταιριάζει. Δοκιμάστε άλλη λέξη.</p>`;
  $("#plist2").querySelectorAll(".copy").forEach(b=>b.onclick=()=>copyText(b.previousElementSibling.querySelector(".t").textContent,b.previousElementSibling.querySelector(".t")))};
 $("#pcat").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cur}">${c}</button>`).join("");
 $("#pcat").querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=b.textContent;$("#pcat").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));rend()});
 $("#psearch").oninput=rend;rend();
};

const SCEN=[

VIEWS.senaria=()=>`<section class="mod">${head("senaria",`<p class="lead">Χωριστείτε σε ομάδες των 5 ή 6. Ορίστε δύο διαμεσολαβητές, έναν ή δύο παρατηρητές και τα δύο μέρη της σύγκρουσης. Έχετε 15 λεπτά για τη διαμεσολάβηση και 5 για ανατροφοδότηση.</p>`)}
 <div class="card block" id="active"></div>
 <div class="block"><h2>Όλα τα σενάρια</h2><div class="grid g2" id="sclist"></div></div>
 ${completeBar("senaria")}</section>`;
let timerH=null;
INIT.senaria=()=>{
 clearInterval(timerH);
 $("#sclist").innerHTML=SCEN.map((s,i)=>`<button class="modcard" data-s="${i}"><span class="k">${s.k}</span><b>${s.t}</b><span>${esc(s.d.slice(0,110))}…</span></button>`).join("");
 $("#sclist").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{pick(+b.dataset.s);$("#active").scrollIntoView({behavior:"smooth",block:"start"})});
 let left=900,phase=0,run=false;
 function pick(i){const s=SCEN[i];clearInterval(timerH);run=false;left=900;phase=0;
  $("#active").innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">${s.k}</div><h2>${s.t}</h2></div><button class="btn ghost" id="rnd">Τυχαίο σενάριο</button></div>
  <p class="prose">${s.d}</p>
  <div class="roles"><div class="role"><b class="pa">Μέρος Α</b>${s.a}</div><div class="role"><b class="pb">Μέρος Β</b>${s.b}</div><div class="role"><b style="color:var(--med)">2 διαμεσολαβητές</b>Εναλλάσσονται στις ερωτήσεις</div><div class="role"><b>1–2 παρατηρητές</b>Κρατούν σημειώσεις</div></div>
  <div class="grid g2" style="align-items:center"><div><div class="eyebrow" id="tlabel">Διαμεσολάβηση · 15 λεπτά</div><div class="timer" id="tval">15:00</div></div>
  <div class="row"><button class="btn" id="tgo">Έναρξη</button><button class="btn ghost" id="treset">Επαναφορά</button><button class="btn ghost" id="tfb">Πάμε στην ανατροφοδότηση</button></div></div>
  <details class="card"><summary><b>Ερωτήσεις των παρατηρητών</b></summary><p class="muted" style="margin-top:8px">Οι παρατηρητές ρωτούν τον καθένα, ενώ είναι ακόμη στον ρόλο του:</p><ol style="margin:6px 0 0;padding-left:1.2em"><li>Τι πήγε καλά;</li><li>Τι θα άλλαζες;</li><li>Πώς ένιωσες στον ρόλο σου;</li><li>Βγες από τον ρόλο σου και πες το πραγματικό σου όνομα.</li></ol><p class="muted" style="margin-top:8px">Στο τέλος δίνουν ανατροφοδότηση στην ομάδα: τι πήγε καλά και ποια σημεία χρειάζονται περισσότερη εξάσκηση.</p></details>`;
  const fmt=()=>{$("#tval").textContent=`${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`;$("#tlabel").textContent=phase?"Ανατροφοδότηση · 5 λεπτά":"Διαμεσολάβηση · 15 λεπτά"};
  const tick=()=>{if(left>0){left--;fmt()}else if(!phase){phase=1;left=300;fmt();toast("Τέλος χρόνου. Ώρα για ανατροφοδότηση.")}else{clearInterval(timerH);run=false;$("#tgo").textContent="Έναρξη";toast("Η άσκηση ολοκληρώθηκε")}};
  $("#tgo").onclick=()=>{if(run){clearInterval(timerH);run=false;$("#tgo").textContent="Συνέχεια"}else{timerH=setInterval(tick,1000);run=true;$("#tgo").textContent="Παύση"}};
  $("#treset").onclick=()=>{clearInterval(timerH);run=false;left=900;phase=0;$("#tgo").textContent="Έναρξη";fmt()};
  $("#tfb").onclick=()=>{phase=1;left=300;fmt()};
  $("#rnd").onclick=()=>pick(Math.floor(Math.random()*SCEN.length));fmt()}
 pick(0);
};

function quiz(sel,qs,onEnd){
 let s=0,n=0;
 $(sel).innerHTML=qs.map((q,i)=>`<div class="card q" data-i="${i}" style="margin-bottom:12px"><div class="eyebrow" style="color:var(--muted)">Ερώτηση ${i+1} από ${qs.length}</div><b>${q.q}</b><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}</div><div class="fb" hidden></div></div>`).join("");
 $(sel).querySelectorAll(".q").forEach(c=>{const q=qs[+c.dataset.i];c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const j=+b.dataset.j,ok=j===q.a;n++;if(ok)s++;
  c.querySelectorAll(".opt").forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add("right")});if(!ok)b.classList.add("wrong");
  const fb=c.querySelector(".fb");fb.hidden=false;fb.innerHTML=`<b style="color:${ok?"var(--med)":"var(--b)"}">${ok?"Σωστά.":"Όχι ακριβώς."}</b> ${q.e}`;
  if(n===qs.length&&onEnd)onEnd(s,n)})});
}
