<!doctype html><html lang="el"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Συγκρίνω δύο σχολές · Εργαλειοθήκη</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f2f5;color:#242338;font:17px/1.55 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px}a{color:#673761}h1{line-height:1.16;font: bold clamp(1.9rem,5vw,3rem)/1.16 Georgia,serif;margin-bottom:.4em}fieldset,section{background:white;border:1px solid #d4ccd5;border-radius:14px;padding:20px;margin:16px 0;min-width:0}legend,h2{font-weight:700;font-size:1.2rem;color:#633862}label{display:block;margin:.7rem 0;font-weight:600}input,textarea,select{display:block;width:100%;padding:.6rem;border:1px solid #837784;border-radius:6px;font:inherit;margin-top:.25rem}button{background:#61385f;color:white;border:0;border-radius:8px;font:inherit;padding:12px 20px;cursor:pointer}ul{padding-left:1.5em}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:640px){.pair{display:block}main{padding:16px}}@media print{form,nav,button,main>p{display:none}section{border:0}body{background:white}}</style><main><nav><a href="../?mathites">Επιστροφή στην Εργαλειοθήκη</a></nav><h1>Συγκρίνω δύο σχολές</h1><p>Βάλε δίπλα δίπλα δύο επιλογές σπουδών. Στο τέλος πάρε μαζί σου τρεις ερωτήσεις για τη συνάντηση με τον σύμβουλό σου.</p><form><div class="pair"><fieldset><legend>Επιλογή Α</legend><label>Σχολή ή πρόγραμμα<input required></label><label>Τι με ελκύει;<textarea rows="2"></textarea></label><label>Τι με προβληματίζει;<textarea rows="2"></textarea></label></fieldset><fieldset><legend>Επιλογή Β</legend><label>Σχολή ή πρόγραμμα<input required></label><label>Τι με ελκύει;<textarea rows="2"></textarea></label><label>Τι με προβληματίζει;<textarea rows="2"></textarea></label></fieldset></div><fieldset><legend>Οι τρεις ερωτήσεις μου</legend><p>Προσάρμοσε τις ερωτήσεις σε όσα θέλεις να μάθεις.</p><label>Ερώτηση 1<textarea required rows="2">Ποια μαθήματα κάθε σχολής ταιριάζουν περισσότερο στα ενδιαφέροντά μου;</textarea></label><label>Ερώτηση 2<textarea required rows="2">Πού μπορώ να ελέγξω τις προϋποθέσεις εισαγωγής και το κόστος;</textarea></label><label>Ερώτηση 3<textarea required rows="2">Με ποιον μπορώ να μιλήσω για την καθημερινότητα των φοιτητών;</textarea></label></fieldset><button>Δημιουργία σύνοψης</button></form><section hidden id="summary" tabindex="-1"><h2>Η σύνοψή μου</h2><pre></pre><button type="button" onclick="window.print()">Εκτύπωση ή PDF</button></section></main><script>const form=document.querySelector('form'),summary=document.querySelector('#summary');form.addEventListener('input',()=>summary.hidden=true);form.addEventListener('submit',event=>{event.preventDefault();const sections=[...form.querySelectorAll('fieldset')].map(group=>{const lines=[group.querySelector('legend').textContent];for(const label of group.querySelectorAll('label')){const value=label.querySelector('input,textarea,select').value.trim();if(value)lines.push(label.firstChild.textContent+'\n'+value)}for(const li of group.querySelectorAll('li'))lines.push('• '+li.textContent);return lines.join('\n\n')});summary.querySelector('pre').textContent=sections.join('\n\n────────\n\n');summary.hidden=false;summary.focus()});</script></html>
