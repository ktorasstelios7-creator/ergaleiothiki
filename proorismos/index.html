<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ο προορισμός σου</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Commissioner:wght@400;500;700;800&family=Fira+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one screen at a time, like gates in an airport; a departures board opens the trip, a boarding pass closes it. Sequel to «Το ταξίδι σου». */
:root{
  --ink:#1E2557; --ink2:#4A5185; --paper:#F6F7FF; --card:#FFFFFF; --line:#DADDF3; --chipbg:#EEF0FF;
  --sun:#FFC93C; --coral:#FF6F7D; --mint:#22C3A6; --sky:#5B8CFF; --grape:#8E6CEF;
  --ok:#17A589; --bad:#E2475A; --warnbg:#FFF3D1; --warnfg:#7A5300;
  --board:#141833; --boardfg:#FFD866; --boardline:#2B3163;
  --f-display:"Comfortaa","Commissioner",system-ui,sans-serif;
  --f-body:"Commissioner",system-ui,"Segoe UI",Arial,sans-serif;
  --f-mono:"Fira Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#EEF0FF; --ink2:#B4B9E0; --paper:#151935; --card:#20264A; --line:#353C6B; --chipbg:#2A3160; --warnbg:#3A3214; --warnfg:#FFD98A; --board:#0B0E22; --boardline:#2B3163; color-scheme:dark; }
}
:root[data-theme="dark"]{ --ink:#EEF0FF; --ink2:#B4B9E0; --paper:#151935; --card:#20264A; --line:#353C6B; --chipbg:#2A3160; --warnbg:#3A3214; --warnfg:#FFD98A; --board:#0B0E22; --boardline:#2B3163; color-scheme:dark; }

*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55; -webkit-tap-highlight-color:transparent; }
h1,h2,h3{ font-family:var(--f-display); line-height:1.2; margin:0 0 .5em; text-wrap:balance; }
h1{ font-size:clamp(2rem,7vw,3.3rem); letter-spacing:-.02em; }
h2{ font-size:clamp(1.4rem,4.6vw,2rem); }
h3{ font-size:1.1rem; }
p{ margin:.2em 0 .9em; }
a{ color:var(--sky); overflow-wrap:anywhere; }
button{ font:inherit; color:inherit; cursor:pointer; }
:focus-visible{ outline:3px solid var(--sky); outline-offset:2px; border-radius:8px; }

/* top bar */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); padding:10px 16px 8px; border-bottom:1px solid var(--line); }
.toprow{ display:flex; align-items:center; gap:10px; max-width:820px; margin:0 auto; }
.rw{ flex:1; position:relative; height:22px; }
.rw .rail{ position:absolute; left:0; right:0; top:9px; height:4px; border-radius:4px; background:var(--line); }
.rw .fill{ position:absolute; left:0; top:9px; height:4px; border-radius:4px; background:linear-gradient(90deg,var(--coral),var(--sun) 50%,var(--mint)); transition:width .4s; }
.rw .stop{ position:absolute; top:3px; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:var(--card); border:3px solid var(--line); padding:0; }
.rw .stop.done{ border-color:var(--ink); background:var(--sun); }
.rw .stop.gate{ width:20px; height:20px; top:1px; margin-left:-10px; }
@media (max-width:600px){ .rw .stop:not(.gate){ width:10px; height:10px; top:6px; margin-left:-5px; border-width:2px; } }
.xp{ font-weight:800; font-size:.9rem; background:var(--sun); color:#1E2557; padding:4px 10px; border-radius:999px; white-space:nowrap; }
.xp.pop{ animation:pop .4s; }
@keyframes pop{ 50%{ transform:scale(1.25);} }
.gname{ max-width:820px; margin:4px auto 0; font-size:.82rem; color:var(--ink2); font-weight:600; }

main{ max-width:820px; margin:0 auto; padding:22px 16px 120px; }
.screen{ animation:enter .35s ease; }
@keyframes enter{ from{ opacity:0; transform:translateY(10px);} }

.lead{ font-size:1.06rem; color:var(--ink2); }
.panel{ background:var(--card); border:2px solid var(--line); border-radius:18px; padding:16px 18px; margin:12px 0; min-width:0; }
.grid{ display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); }
.grid > .panel{ margin:0; }
.chip{ display:inline-block; background:var(--chipbg); border-radius:999px; padding:4px 11px; margin:3px 2px; font-size:.9rem; font-weight:600; }
.btn{ border:none; border-radius:14px; padding:12px 18px; font-weight:800; background:var(--ink); color:var(--paper); }
.btn.alt{ background:var(--chipbg); color:var(--ink); }
.hint{ font-size:.88rem; color:var(--ink2); }
.tag{ font-size:.72rem; font-weight:800; padding:2px 8px; border-radius:6px; background:var(--sun); color:#1E2557; white-space:nowrap; }
.tag.y27{ background:var(--grape); color:#fff; }
.warn{ background:var(--warnbg); color:var(--warnfg); border-radius:14px; padding:12px 14px; margin:12px 0; font-weight:600; }
.warn b{ color:inherit; }
.mono{ font-family:var(--f-mono); }
ul.tidy{ margin:.3em 0 .6em; padding-left:1.2em; } ul.tidy li{ margin:.2em 0; }

/* nav */
.nav{ position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--paper); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); }
.navin{ max-width:820px; margin:0 auto; display:flex; gap:10px; align-items:center; }
.navin .sp{ flex:1; text-align:center; font-size:.85rem; color:var(--ink2); }

/* departures board */
.board{ background:var(--board); color:var(--boardfg); border-radius:18px; padding:14px 14px 10px; font-family:var(--f-mono); border:3px solid var(--boardline); overflow-x:auto; }
.board .bh{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:.75rem; letter-spacing:.14em; color:#9AA3E0; margin-bottom:8px; flex-wrap:wrap; }
.board .bh b{ color:var(--boardfg); font-size:.95rem; letter-spacing:.08em; }
.board table{ border-collapse:separate; border-spacing:0 5px; width:100%; min-width:460px; font-size:.86rem; }
.board th{ text-align:left; font-size:.68rem; letter-spacing:.14em; color:#9AA3E0; font-weight:500; padding:0 8px; }
.board td{ background:#1F2450; padding:7px 8px; white-space:nowrap; }
.board td:first-child{ border-radius:8px 0 0 8px; } .board td:last-child{ border-radius:0 8px 8px 0; }
.board .st{ color:#7EF0C9; }
.board .flap{ display:inline-block; min-width:.62em; text-align:center; }
.yearline{ display:flex; gap:8px; align-items:flex-start; background:var(--chipbg); border-radius:14px; padding:10px 12px; margin:12px 0; font-size:.92rem; }
.yearline .tag{ margin-top:2px; }

.gates{ display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr)); margin-top:16px; }
.gatecard{ border:none; border-radius:16px; padding:12px 14px; text-align:left; color:#1E2557; min-width:0; }
.gatecard small{ display:block; font-family:var(--f-mono); font-size:.72rem; letter-spacing:.12em; }
.gatecard b{ font-family:var(--f-display); font-size:1.02rem; display:block; }
input[type=text]{ font:inherit; padding:12px 14px; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--ink); width:100%; max-width:360px; }

/* versus */
.vs{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.vs .panel{ margin:0; border-top-width:8px; }
@media (max-width:560px){ .vs{ grid-template-columns:1fr; } }

/* sort game */
.sortcard{ font-size:1.15rem; font-weight:800; text-align:center; padding:24px 16px; border-radius:20px; background:var(--card); border:3px dashed var(--line); margin:10px 0; min-height:92px; display:grid; place-items:center; }
.sortbtns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sortbtns button{ padding:14px; border-radius:16px; border:none; font-weight:800; color:#1E2557; }
.fb{ min-height:1.6em; font-weight:700; text-align:center; }
.fb.ok{ color:var(--ok);} .fb.no{ color:var(--bad);}

/* plaisio explorer */
.ptabs{ display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 4px; }
.ptabs button{ border:2px solid var(--line); background:var(--card); border-radius:12px; padding:8px 12px; font-weight:800; font-family:var(--f-mono); }
.ptabs button.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.pcard{ border-radius:18px; overflow:hidden; border:2px solid var(--line); background:var(--card); margin-top:10px; }
.pcard .ph{ padding:12px 16px; color:#1E2557; display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
.pcard .ph b{ font-family:var(--f-display); font-size:1.15rem; }
.pcard .pb{ padding:12px 16px; display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr)); }
.pcard .pb > div{ min-width:0; }
.pcard h4{ margin:0 0 4px; font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2); }
.flag{ font-family:var(--f-mono); font-size:.72rem; font-weight:700; padding:1px 6px; border-radius:5px; border:1.5px solid currentColor; margin-right:4px; }

/* builder */
.subjects{ display:flex; flex-wrap:wrap; gap:6px; }
.subj{ border:2px solid var(--line); background:var(--card); border-radius:999px; padding:7px 12px; font-weight:700; font-size:.9rem; }
.subj.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.subj.sp{ border-style:dashed; }
.counter{ font-family:var(--f-mono); font-weight:700; }
.plist{ display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr)); margin-top:10px; }
.pitem{ border:2px solid var(--line); border-radius:14px; padding:10px 12px; background:var(--card); min-width:0; }
.pitem.valid{ border-color:var(--ok); box-shadow:4px 4px 0 var(--mint); }
.pitem .pt{ display:flex; justify-content:space-between; gap:8px; align-items:center; font-weight:800; }
.pitem .need{ font-size:.82rem; color:var(--ink2); margin-top:4px; }
.pill{ font-size:.72rem; font-weight:800; padding:2px 8px; border-radius:999px; white-space:nowrap; }
.pill.ok{ background:var(--ok); color:#fff; } .pill.no{ background:var(--chipbg); color:var(--ink2); }

/* grade calc */
.grow{ display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:6px 10px; align-items:center; }
.grow label{ font-weight:700; font-size:.95rem; min-width:0; }
.grow input[type=range]{ width:min(42vw,220px); accent-color:var(--coral); }
.grow .gv{ font-family:var(--f-mono); font-weight:700; min-width:3.4em; text-align:right; }
.grow .ab{ grid-column:1 / -1; justify-self:start; margin:-4px 0 4px; }
.absent{ border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:2px 10px; font-size:.78rem; font-weight:700; }
.absent.on{ background:var(--bad); color:#fff; border-color:var(--bad); }
.res{ display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); }
.res .r{ border-radius:16px; padding:12px 14px; background:var(--chipbg); min-width:0; }
.res .r small{ display:block; font-size:.78rem; color:var(--ink2); font-weight:700; }
.res .r .big{ font-family:var(--f-mono); font-size:1.7rem; font-weight:700; font-variant-numeric:tabular-nums; }
.res .r.gr{ background:var(--ink); color:var(--paper); } .res .r.gr small{ color:inherit; opacity:.8; }
.res .r.void{ opacity:.6; text-decoration:line-through; }

/* timeline */
.months{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
.months button{ flex:0 0 auto; border:2px solid var(--line); background:var(--card); border-radius:12px; padding:8px 12px; font-weight:800; font-family:var(--f-mono); font-size:.85rem; }
.months button.on{ background:var(--sun); color:#1E2557; border-color:var(--ink); }
.months button i{ display:block; font-style:normal; font-weight:500; font-size:.68rem; letter-spacing:.06em; }
.tl{ list-style:none; padding:0; margin:12px 0; display:grid; gap:8px; }
.tl li{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:10px 12px; }
.tl .d{ font-family:var(--f-mono); font-weight:700; font-size:.85rem; background:var(--chipbg); border-radius:10px; padding:6px 8px; text-align:center; min-width:96px; line-height:1.25; }
.tl .who{ font-size:.75rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); }
@media (max-width:480px){ .tl li{ grid-template-columns:1fr; gap:6px; } .tl .d{ justify-self:start; } }

/* steps */
.steps{ list-style:none; padding:0; margin:10px 0; counter-reset:s; display:grid; gap:6px; }
.steps li{ position:relative; padding:9px 12px 9px 46px; background:var(--chipbg); border-radius:14px; }
.steps li::before{ counter-increment:s; content:counter(s); position:absolute; left:10px; top:9px; width:26px; height:26px; border-radius:50%; background:var(--ink); color:var(--paper); display:grid; place-items:center; font-weight:800; font-size:.85rem; }
.steps li.key{ background:var(--warnbg); color:var(--warnfg); }
.fee{ display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
.stepper{ display:inline-flex; align-items:center; border:2px solid var(--line); border-radius:12px; overflow:hidden; }
.stepper button{ border:none; background:var(--chipbg); width:40px; height:40px; font-size:1.2rem; font-weight:800; }
.stepper span{ min-width:44px; text-align:center; font-family:var(--f-mono); font-weight:700; }
.feetotal{ font-family:var(--f-mono); font-size:1.6rem; font-weight:700; }
.check{ display:flex; gap:8px; align-items:center; font-weight:600; }
.check input{ width:20px; height:20px; accent-color:var(--coral); }

/* fields + phases */
.fields{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
.field{ border:none; border-radius:16px; padding:12px 8px; color:#1E2557; font-weight:800; font-size:.85rem; min-width:0; overflow-wrap:anywhere; hyphens:auto; text-align:left; }
.field b{ display:block; font-family:var(--f-display); font-size:1.4rem; }
.field.on{ outline:3px solid var(--ink); outline-offset:2px; }
@media (max-width:600px){ .fields{ grid-template-columns:1fr 1fr; } }
.phases{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:8px; align-items:stretch; }
.phases .panel{ margin:0; }
.phases .arr{ align-self:center; font-size:1.6rem; color:var(--ink2); }
@media (max-width:560px){ .phases{ grid-template-columns:1fr; } .phases .arr{ justify-self:center; transform:rotate(90deg); } }

/* cases */
.cases{ display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr)); }
.case{ text-align:left; border:2px solid var(--line); background:var(--card); border-radius:16px; padding:12px 14px; font-weight:800; min-width:0; }
.case small{ display:block; font-weight:500; font-size:.8rem; color:var(--ink2); }
.case.on{ border-color:var(--ink); box-shadow:4px 4px 0 var(--sun); }
.tablewrap{ overflow-x:auto; }
table.t{ border-collapse:collapse; width:100%; font-size:.88rem; }
table.t th, table.t td{ padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
table.t td.n{ font-family:var(--f-mono); font-weight:700; white-space:nowrap; }

/* quiz */
.qz .opts{ display:grid; gap:8px; grid-template-columns:repeat(2,minmax(0,1fr)); }
@media (max-width:520px){ .qz .opts{ grid-template-columns:1fr; } }
.qz .opts button{ border:2px solid var(--line); background:var(--card); border-radius:14px; padding:12px; font-weight:700; text-align:left; overflow-wrap:anywhere; }
.qz .opts button.ok{ background:var(--ok); color:#fff; border-color:var(--ok); }
.qz .opts button.no{ background:var(--bad); color:#fff; border-color:var(--bad); }
.qz .opts button:disabled{ cursor:default; }
.qz .why{ background:var(--chipbg); border-radius:12px; padding:10px 12px; margin-top:10px; font-size:.95rem; }
.qz .qtop{ display:flex; justify-content:space-between; align-items:center; font-size:.82rem; color:var(--ink2); font-weight:700; margin-bottom:6px; gap:8px; }
.qz .dots{ display:flex; gap:4px; flex-wrap:wrap; } .qz .dots i{ width:8px; height:8px; border-radius:50%; background:var(--line); } .qz .dots i.ok{ background:var(--ok);} .qz .dots i.no{ background:var(--bad);}

/* boarding pass */
.pass{ display:grid; grid-template-columns:minmax(0,1fr) 150px; border-radius:22px; overflow:hidden; background:var(--card); border:2px solid var(--line); }
.pass .main{ padding:18px; min-width:0; }
.pass .stub{ background:var(--ink); color:var(--paper); padding:18px 14px; border-left:3px dashed var(--line); display:flex; flex-direction:column; gap:8px; }
.pass .stub small, .pass .main small{ display:block; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; opacity:.75; font-weight:700; }
.pass .stub b{ font-family:var(--f-mono); font-size:1.05rem; }
.pass .route{ display:flex; align-items:center; gap:10px; font-family:var(--f-mono); font-weight:700; font-size:1.5rem; margin:4px 0 10px; flex-wrap:wrap; }
.pass .route i{ font-style:normal; color:var(--coral); }
@media (max-width:560px){ .pass{ grid-template-columns:1fr; } .pass .stub{ border-left:none; border-top:3px dashed var(--line); flex-direction:row; flex-wrap:wrap; gap:14px; } }
.todo{ display:grid; gap:6px; }
.todo label{ display:flex; gap:10px; align-items:flex-start; background:var(--chipbg); border-radius:12px; padding:8px 10px; font-weight:600; font-size:.95rem; }
.todo input{ width:20px; height:20px; accent-color:var(--mint); flex-shrink:0; margin-top:2px; }
.links a{ display:block; padding:5px 0; }
.links small{ color:var(--ink2); }
.credits{ font-size:.8rem; color:var(--ink2); }

.toast{ position:fixed; left:50%; top:calc(70px + env(safe-area-inset-top,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:8px 16px; border-radius:999px; font-weight:800; z-index:15; animation:toast 1.6s forwards; pointer-events:none; max-width:calc(100% - 32px); text-align:center; }
@keyframes toast{ 0%{opacity:0; transform:translate(-50%,10px)} 15%{opacity:1; transform:translate(-50%,0)} 80%{opacity:1} 100%{opacity:0; transform:translate(-50%,-14px)} }

@media (prefers-reduced-motion:reduce){ .screen,.xp.pop,.toast{ animation:none; } .rw .fill{ transition:none; } }
</style>

<div class="top">
  <div class="toprow">
    <div class="rw" id="rw"><div class="rail"></div><div class="fill" id="fill"></div></div>
    <span class="xp" id="xp">⭐ 0</span>
  </div>
  <div class="gname" id="gname"></div>
</div>
<main id="main"></main>
<div class="nav"><div class="navin">
  <button class="btn alt" id="prev" aria-label="Προηγούμενο">←</button>
  <div class="sp" id="count"></div>
  <button class="btn" id="next">Επόμενο</button>
</div></div>

<script>
/* ---------- helpers & state ---------- */
const $=(q,r=document)=>r.querySelector(q), $$=(q,r=document)=>[...r.querySelectorAll(q)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const reduced=()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } };
const KEY="proorismos-v1";
const S={ i:0, xp:0, done:{}, name:"", subj:["NE","MA","FY","XH","OI"], todo:{} };
try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) Object.assign(S,s); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1700); }
function award(k,p){ if(S.done[k]) return; S.done[k]=1; S.xp+=p; save(); const x=$("#xp"); x.textContent="⭐ "+S.xp; x.classList.remove("pop"); void x.offsetWidth; x.classList.add("pop"); toast(`+${p} ⭐`); }

/* ---------- data (ΥΣΕΑ, Φεβρουάριος 2026) ---------- */
const GATES=[
  {n:"Δύο εξετάσεις", hex:"#FF8C98"},
  {n:"Πλαίσια Πρόσβασης", hex:"#FFD166"},
  {n:"Ο βαθμός σου", hex:"#7EE0C9"},
  {n:"Αίτηση & ημερομηνίες", hex:"#9EC5FF"},
  {n:"Ελλάδα", hex:"#C9B5FF"},
  {n:"Η δική σου περίπτωση", hex:"#FFB38A"}
];
const SUBJ={

const grpName=g=>g.map(k=>SUBJ[k]).join(" ή ");

function check(p, sel){
  const has=k=>sel.includes(k);
  const missReq=p.req.filter(g=>!g.some(has));
  const optHit=p.opt.filter(g=>g.some(has)).length;
  const ok=!missReq.length && optHit>=p.pick;
  return {ok, missReq, optHit, optNeed:Math.max(0,p.pick-optHit)};
}

    if(valid>=2) award("build",15);
  };
  $$(".subj",el).forEach(b=>b.onclick=()=>{ const k=b.dataset.k, i=S.subj.indexOf(k);

  draw();
});

    </tbody></table></div><p class="hint">Συνοπτικά. Ο πλήρης πίνακας και οι όροι στον Οδηγό ΠΕΠ, τόμος Α΄ και Β΄.</p>`},
  {t:"Χρειάζομαι διευκολύνσεις", s:"Ειδικές ανάγκες", h:`<p>Μαζί με την αίτηση ΠΕΠ υποβάλλεις ηλεκτρονική αίτηση για <b>παροχή διευκολύνσεων</b> στην Υπηρεσία Εξετάσεων, με όλα τα δικαιολογητικά (ΕΕΕΑΕ, ιατρική βεβαίωση). Αίτηση κάνουν και όσοι έχουν κατ' οίκον εκπαίδευση.</p>`},
  {t:"Έχω γονείς ελληνικής καταγωγής", s:"Έλληνες Εξωτερικού", h:`<div class="grid"><div class="panel" style="margin:0"><b>Και οι δύο γονείς</b><p style="margin:.3em 0 0">Διεκδικείς θέση στα ΑΕΙ Ελλάδας μέσω της κατηγορίας «Έλληνες του Εξωτερικού», όχι μαζί με τους υπόλοιπους Κύπριους μαθητές.</p></div><div class="panel" style="margin:0"><b>Ο ένας γονέας</b><p style="margin:.3em 0 0">Αν είσαι απόφοιτος Λυκείου/ΤΕΣΕΚ της Κύπρου, <b>επιλέγεις</b>: «Έλληνες του Εξωτερικού» ή «Αλλοδαποί-Αλλογενείς».</p></div></div><p style="margin-top:10px">Και στις δύο περιπτώσεις χρειάζεται πλήρης φοίτηση τουλάχιστον στις δύο τελευταίες τάξεις του Λυκείου εκτός Ελλάδας. Η αίτηση γίνεται τον Ιούλιο στο <b>www.minedu.gov.gr</b> (Εξετάσεις → Έλληνες του Εξωτερικού). Οι εξετάσεις τους γίνονται τον Σεπτέμβριο στην Ελλάδα.</p>`},
  {t:"Καλές Τέχνες ή Δραματική", s:"Ειδικό σύστημα", h:`<p>Αυτές οι σχολές <b>δεν</b> μπαίνουν στην αίτηση των ΠΕΠ. Έχουν δικό τους σύστημα εισαγωγής:</p><ul class="tidy"><li>Τμήμα Καλών Τεχνών ΤΕΠΑΚ</li><li>Σχολές Καλών Τεχνών Ελλάδας</li><li>Δραματικές Σχολές</li></ul><p>Παρακολούθησε την ιστοσελίδα της Υπηρεσίας Εξετάσεων και των σχολών που σε ενδιαφέρουν, και μίλα με τον/την Καθηγητή/τρια Σ.Ε.Α.</p>`},
  {t:"Θέλω Μηχανική στην Ελλάδα", s:"Αναγνώριση από ΕΤΕΚ", h:`<ul class="tidy"><li>Το ΕΤΕΚ <b>προς το παρόν δεν αναγνωρίζει</b> τα επαγγελματικά δικαιώματα αποφοίτων ΑΣΠΑΙΤΕ ως ισοδύναμα με διπλώματα Πολυτεχνικών Σχολών (π.χ. ΕΜΠ, ΑΠΘ, Παν. Κρήτης).</li><li>Για συγκεκριμένα Τμήματα του ΠΑΔΑ, ΔΙΠΑΕ, ΕΛΜΕΠΑ και Παν. Πελοποννήσου (πρώην ΤΕΙ), οι απόφοιτοι εγγράφονται στο ΤΕΕ, σύμφωνα με ανακοίνωση του ΕΤΕΚ.</li><li>Πριν δηλώσεις, έλεγξε τις ανακοινώσεις στο <b>www.etek.org.cy</b>.</li></ul>`},
  {t:"Σκέφτομαι το εξωτερικό", s:"Εκτός Κύπρου/Ελλάδας", h:`<p>Έλεγξε προσεκτικά τα κριτήρια εισδοχής. Κάποια ιδρύματα ζητούν <b>Βαθμό Πρόσβασης</b> από τις ΠΕΠ, π.χ. στη Γερμανία, την Ισπανία και την Ιταλία. Αν τον χρειάζεσαι, πρέπει να γράψεις τις ΠΕΠ τη χρονιά που κάνεις αίτηση, αφού ισχύει μόνο για εκείνο το έτος.</p>`},
  {t:"Θα πάω στρατό τον Ιούλιο", s:"Εθνοφρουροί", h:`<p>Παρακολούθησε τις ιστοσελίδες των Πανεπιστημίων Κύπρου για τη <b>συμπληρωματική κατανομή</b> θέσεων. Ενδέχεται να γίνει τον Σεπτέμβριο για το ΠΚ και τον Μάρτιο του επόμενου έτους για το ΤΕΠΑΚ.</p>`}
];
add(5,"Ειδικές περιπτώσεις",()=>`
<h2>Ποια είναι η δική σου περίπτωση;</h2>
<p class="lead">Πάτησε ό,τι σε αφορά. Μπορεί να είναι πάνω από ένα.</p>
<div class="cases" id="cs">${CASES.map((c,i)=>`<button class="case" data-i="${i}">${c.t}<small>${c.s}</small></button>`).join("")}</div>
<div class="panel" id="co"><span class="hint">Διάλεξε μια περίπτωση.</span></div>
<p class="hint">Για τους μαθητές του Γυμνασίου Ριζοκαρπάσου υπάρχουν ειδικά κριτήρια εισαγωγής στο ΠΚ και το ΤΕΠΑΚ. Ρώτησε τον/την Καθηγητή/τρια Σ.Ε.Α.</p>`, el=>{
  const seen=new Set();
  $$("#cs .case",el).forEach(b=>b.onclick=()=>{ const c=CASES[+b.dataset.i]; $$("#cs .case",el).forEach(x=>x.classList.toggle("on",x===b)); $("#co",el).innerHTML=`<h3>${c.t}</h3>${c.h}`; seen.add(b.dataset.i); if(seen.size>=3) award("cases",10); });
});

/* Quiz */
const QS=[
  {q:"Πόσα μαθήματα μπορείς να δηλώσεις για Πρόσβαση;", a:"Μέχρι 7, και μέχρι 3 Ειδικές Εξετάσεις", o:["Ακριβώς 5","Μέχρι 7, και μέχρι 3 Ειδικές Εξετάσεις","Μέχρι 10","Μόνο όσα έχεις στο σχολείο"], why:"Μέχρι 7 μαθήματα και μέχρι 3 Ειδικές Εξετάσεις (Πρακτική Δοκιμασία, Μουσικές Σπουδές, Μουσική Εκτέλεση & Ερμηνεία)."},
  {q:"Τον Μάρτιο δεν δήλωσες Πλαίσια με σχολές της Ελλάδας. Τι γίνεται τον Ιούλιο;", a:"Δεν μπορείς να διεκδικήσεις σχολές της Ελλάδας", o:["Τις προσθέτεις στο Μηχανογραφικό","Δεν μπορείς να διεκδικήσεις σχολές της Ελλάδας","Τις προσθέτει το σχολείο","Πληρώνεις επιπλέον τέλος"], why:"Η Α΄ Φάση (Μάρτιος) είναι προϋπόθεση για τη Β΄ Φάση (Ιούλιος)."},
  {q:"Πόσους βαθμούς παίρνεις για τα ΑΕΙ Ελλάδας;", a:"Έναν Γενικό Βαθμό", o:["Έναν για κάθε Πλαίσιο","Έναν Γενικό Βαθμό","Δύο","Κανέναν, μόνο σειρά"], why:"Κύπρος: πολλαπλοί βαθμοί ανά Πλαίσιο. Ελλάδα: ένας Γενικός Βαθμός Πρόσβασης/Κατάταξης."},
  {q:"Απουσίασες από ένα μάθημα ενός Πλαισίου. Τι γίνεται;", a:"Το Πλαίσιο ακυρώνεται", o:["Μετράει μηδέν","Το Πλαίσιο ακυρώνεται","Ξαναγράφεις τον Σεπτέμβριο","Δεν αλλάζει τίποτα"], why:"Η απουσία από μάθημα Πλαισίου ακυρώνει το συγκεκριμένο Πλαίσιο."},
  {q:"Μπορείς να γράψεις για Πρόσβαση μάθημα που δεν διδάσκεσαι στο σχολείο;", a:"Ναι", o:["Ναι","Όχι","Μόνο ξένες γλώσσες","Μόνο αν είσαι απόφοιτος"], keep:1, why:"Τα μαθήματα Πρόσβασης δηλώνονται ανεξάρτητα από αυτά του σχολείου."},
  {q:"Στο Μηχανογραφικό Ελλάδας, πόσες επιλογές έχεις;", a:"Μέχρι 20, από ένα μόνο Επιστημονικό Πεδίο", o:["Απεριόριστες","Μέχρι 20, από ένα μόνο Επιστημονικό Πεδίο","Μέχρι 20, από όλα τα Πεδία","Μέχρι 10"], why:"Μέχρι 20 Σχολές/Τμήματα, όλες από ΕΝΑ Επιστημονικό Πεδίο."},
  {q:"Η σειρά προτίμησης για Κύπρο και για Ελλάδα:", a:"Μπορεί να διαφέρει", o:["Πρέπει να είναι ίδια","Μπορεί να διαφέρει","Ορίζεται από το ΥΠΑΝ","Δεν υπάρχει σειρά"], why:"Είναι δύο ξεχωριστές δηλώσεις, με διαφορετική σειρά αν θέλεις."},
  {q:"Πού μαθαίνεις ημερομηνίες και αποτελέσματα για τις Στρατιωτικές Σχολές;", a:"Στο www.mod.gov.cy", o:["Θα σου στείλουν επιστολή","Στο www.mod.gov.cy","Από τον διευθυντή του σχολείου","Με SMS"], why:"Δεν στέλνονται προσωπικά μηνύματα ή επιστολές: παρακολουθείς την ιστοσελίδα του Υπουργείου Άμυνας."}
];
add(5,"Τελικός έλεγχος",()=>`<h2>Τελικός έλεγχος πριν την επιβίβαση</h2><div id="qz"></div>`, el=>{
  let k=0, ok=0, res=[]; const box=$("#qz",el);
  const draw=()=>{
    if(k>=QS.length){ box.innerHTML=`<div class="panel qz"><h3>${ok}/${QS.length} σωστά</h3><p>${ok===QS.length?"Έτοιμος/η για επιβίβαση!":ok>=QS.length/2?"Καλά! Ξαναδές όσα έχασες και δοκίμασε πάλι.":"Ξαναπέρνα από τις πύλες και δοκίμασε πάλι."}</p><button class="btn alt" id="again">Ξανά</button></div>`; $("#again",box).onclick=()=>{k=0;ok=0;res=[];draw();}; award("quiz",ok*3); return; }
    const q=QS[k], opts=q.keep?q.o:shuffle(q.o);
    box.innerHTML=`<div class="panel qz"><div class="qtop"><span>Ερώτηση ${k+1}/${QS.length}</span><span class="dots">${QS.map((_,i)=>`<i class="${res[i]||""}"></i>`).join("")}</span></div><h3>${q.q}</h3><div class="opts">${opts.map(o=>`<button>${esc(o)}</button>`).join("")}</div><div class="slot"></div></div>`;
    $$(".opts button",box).forEach(b=>b.onclick=()=>{ const r=b.textContent===q.a; if(r) ok++; res[k]=r?"ok":"no";
      $$(".opts button",box).forEach(x=>{ x.disabled=true; if(x.textContent===q.a) x.classList.add("ok"); }); if(!r) b.classList.add("no");
      $(".slot",box).innerHTML=`<div class="why">${q.why}</div><button class="btn" style="margin-top:10px" id="nq">${k+1<QS.length?"Επόμενη →":"Αποτέλεσμα"}</button>`; $("#nq",box).onclick=()=>{k++;draw();}; });
  }; draw();
});

  const sel=S.subj, valid=PL.filter(p=>check(p,sel).ok).map(p=>p.n);

<div class="panel links"><h3>Χρήσιμοι σύνδεσμοι</h3>

  <a href="https://www.minedu.gov.gr" target="_blank" rel="noopener">Υπουργείο Παιδείας Ελλάδας</a><small>Εξετάσεις → Αλλοδαποί-Αλλογενείς / Έλληνες του Εξωτερικού</small>

${CREDIT}

}, el=>{
  $$(".todo input",el).forEach((c,i)=>c.onchange=()=>{ S.todo[i]=c.checked; save(); if(TODO.every((_,j)=>S.todo[j])) award("todo",15); });

/* ---------- engine ---------- */
const main=$("#main"), rw=$("#rw");
SCREENS.forEach((s,i)=>{ const b=document.createElement("button"); const isGate=i===0||SCREENS[i-1].g!==s.g; b.className="stop"+(isGate?" gate":""); b.style.left=(i/(SCREENS.length-1)*100)+"%"; b.setAttribute("aria-label",s.t); b.onclick=()=>go(i); rw.appendChild(b); });
function go(i){
  S.i=Math.max(0,Math.min(SCREENS.length-1,i)); save();
  const s=SCREENS[S.i];
  main.innerHTML=`<div class="screen">${s.r()}</div>`; s.init&&s.init(main);
  $("#fill").style.width=(S.i/(SCREENS.length-1)*100)+"%";
  $$(".stop",rw).forEach((b,j)=>b.classList.toggle("done",j<=S.i));
  $("#gname").textContent= s.g<0 ? "Αφετηρία" : `Πύλη ${s.g+1} · ${GATES[s.g].n} — ${s.t}`;
  $("#count").textContent=`${S.i+1} / ${SCREENS.length}`;
  $("#prev").disabled=S.i===0; $("#next").textContent=S.i===SCREENS.length-1?"Αρχή":"Επόμενο";
  $("#xp").textContent="⭐ "+S.xp;
  window.scrollTo({top:0,behavior:reduced()?"auto":"smooth"});
}
$("#prev").onclick=()=>go(S.i-1);
$("#next").onclick=()=>go(S.i===SCREENS.length-1?0:S.i+1);
document.addEventListener("keydown",e=>{ if(e.target.closest("input,textarea")) return; if(e.key==="ArrowRight") go(S.i+1); if(e.key==="ArrowLeft") go(S.i-1); });
go(S.i||0);
</script>
