<style>
/* Ημερολόγιο του γραφείου ΣΕΑ: μήνας / εβδομάδα / λίστα, κατηγορίες, εκκρεμότητες,
   εισερχόμενα μαθητικά αιτήματα (Firebase) και προαιρετικός συγχρονισμός ανάμεσα στις συσκευές. */
:root{
  --bg:#f4f1f5; --paper:#fff; --ink:#1f1a24; --muted:#5f5868; --line:#ddd4e2; --soft:#f8f5fa;
  --accent:#6b3f72; --accent-ink:#fff; --ok:#2f7f55; --ok-bg:#e1f3e8; --warn:#8a5a00; --warn-bg:#fff1d6; --bad:#a3302a; --bad-bg:#fbe4e1;
  --display:"Literata",Georgia,serif; --body:"Commissioner","Segoe UI",system-ui,sans-serif;
  --k1:#6b3f72; --k2:#2f6aa8; --k3:#2f7f74; --k4:#a86b12; --k5:#3f7d3a; --k6:#5b4fa8; --k7:#c2412d; --k8:#6b6b78;
  color-scheme:light}
@media (prefers-color-scheme: dark){:root{
  --bg:#151219; --paper:#1f1b25; --ink:#ece6f0; --muted:#aaa1b3; --line:#352e3d; --soft:#27222e;
  --accent:#c99bd1; --accent-ink:#1b1220; --ok:#7dd3a4; --ok-bg:#173426; --warn:#f2d18c; --warn-bg:#3a2e12; --bad:#ff9a8f; --bad-bg:#3b1e1c;
  --k1:#c99bd1; --k2:#7fb0ea; --k3:#5cc0b1; --k4:#e3a94a; --k5:#86c77e; --k6:#9d92e8; --k7:#f07c66; --k8:#a9a9b6; color-scheme:dark}}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-bottom:60px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .small{font-size:14px}

header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding:12px 0 14px}
.eyebrow{font-size:12.5px;letter-spacing:.09em;font-weight:700;color:var(--muted);text-transform:uppercase}
header.top h1{font-size:clamp(28px,5vw,42px);font-weight:800}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 12px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12.5px;font-weight:700}

.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1.1}
.stat span{color:var(--muted);font-size:14px}

nav.views{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.navd{display:flex;gap:6px;align-items:center}
.navd h2{font-size:20px;min-width:180px;text-align:center}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:13.5px;cursor:pointer}
@media (max-width:640px){.filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.fchip{white-space:nowrap}}
.fchip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.fchip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}

/* μήνας */
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .dow{font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.day{min-height:96px;border:1px solid var(--line);border-radius:12px;padding:5px;background:var(--soft);display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;overflow:hidden}
.day.out{opacity:.45}
.day.we{background:transparent}
.day.is-today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .n{font-weight:700;font-size:14px}
.day.is-today .n{color:var(--accent)}
.ev{display:block;width:100%;border:0;border-left:4px solid var(--c);background:var(--paper);border-radius:6px;padding:2px 6px;font-size:12.5px;line-height:1.3;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.cancelled{text-decoration:line-through;opacity:.6}
.ev.done{opacity:.7}
.more{font-size:12px;color:var(--muted)}
@media (max-width:640px){.day{min-height:58px}.month .ev{font-size:0;height:6px;padding:0;border-left-width:0;background:var(--c)}.month .more{font-size:10px}}

/* εβδομάδα */
.week{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:8px}
@media (max-width:820px){.week{grid-template-columns:1fr}}
.wcol{border:1px solid var(--line);border-radius:14px;background:var(--soft);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:140px}
.wcol.is-today{border-color:var(--accent)}
.wcol h3{font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:var(--body)}
.card{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;background:var(--paper);padding:7px 9px;cursor:pointer;text-align:left;width:100%;display:grid;gap:2px}
.card .t{font-weight:700;font-size:13.5px;color:var(--muted)}
.card .h{font-weight:600;font-size:14.5px;line-height:1.3}
.card .s{font-size:12.5px;color:var(--muted)}
.card.cancelled .h{text-decoration:line-through}
.card.done{opacity:.75}
.add{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:6px;color:var(--muted);cursor:pointer;font-size:14px}

/* λίστα */
.agenda{display:grid;gap:16px}
.agenda h3{font-size:16px;font-family:var(--body);color:var(--muted);text-transform:capitalize}
.agenda .items{display:grid;gap:6px;margin-top:6px}
.warnbox{background:var(--warn-bg);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.warnbox h3{color:var(--warn);font-size:16px;font-family:var(--body)}

/* αιτήματα */
.req{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px;background:var(--paper)}
.req.new{border-left:5px solid var(--warn)}
.req.scheduled{border-left:5px solid var(--ok)}
.req h3{font-size:18px}
.req dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14.5px}
.req dt{color:var(--muted)} .req dd{margin:0}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700}
.p-new{background:var(--warn-bg);color:var(--warn)} .p-scheduled{background:var(--ok-bg);color:var(--ok)} .p-done{background:var(--soft);color:var(--muted)} .p-declined{background:var(--bad-bg);color:var(--bad)}
.soon{color:var(--bad);font-weight:700}
.login{max-width:420px;display:grid;gap:10px}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14.5px}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
pre{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;white-space:pre}

/* φόρμες / διάλογοι */
dialog{border:0;border-radius:20px;padding:0;width:min(560px,calc(100% - 20px));background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,10,25,.45)}
.dlg{padding:18px;display:grid;gap:12px;max-height:88vh;overflow:auto}
.dlg h2{font-size:22px}
label.f{display:grid;gap:4px;font-weight:600;font-size:14.5px}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=email],input[type=password],select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:80px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
@media (max-width:480px){.g3{grid-template-columns:1fr 1fr}.g3>:first-child{grid-column:1/-1}}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:5px 10px;font-size:13.5px;cursor:pointer}
.chipsel button[aria-pressed="true"]{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14.5px;z-index:50;max-width:calc(100% - 30px);text-align:center}
.sync{font-size:13.5px;color:var(--muted)}
footer{margin-top:22px;color:var(--muted);font-size:13.5px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media print{
  body{background:#fff;padding:0} .no-print,nav.views,.today,footer,.filters,.add{display:none!important}
  .panel{border:0;padding:0} .wcol,.card,.day{break-inside:avoid;background:#fff}
}

<div class="wrap">
  <header class="top">
    <div><span class="eyebrow">Λύκειο Αρχαγγέλου «Απόστολος Μάρκος» · Γραφείο 10</span><h1>Ημερολόγιο Σ.Ε.Α.</h1></div>

<script type="module">
const CFG=window.SEA_CONFIG;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uidGen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const CATS=[
  ["math","Συνάντηση μαθητή","--k1"],["gon","Γονείς / κηδεμόνες","--k2"],["ekp","Εκπαιδευτικοί / Υπεύθ. τμήματος","--k3"],
  ["epag","Επαγγελματική αγωγή","--k4"],["omad","Ομαδική / τάξη / εργαστήριο","--k5"],["ypir","Σύσκεψη / υπηρεσιακό","--k6"],
  ["for","Φορείς (ΥΕΨ, ΥΚΕΣ, Κοιν. Ευημερία…)","--k7"],["allo","Άλλο","--k8"]];
const CAT=Object.fromEntries(CATS.map(([k,l,c])=>[k,{l,c:`var(${c})`}]));
const STAT={planned:"Προγραμματισμένο",done:"Έγινε",cancelled:"Ακυρώθηκε"};
const RSTAT={new:"Νέο",scheduled:"Κλείστηκε",done:"Ολοκληρώθηκε",declined:"Θα μιλήσουμε από κοντά"};
const DOW=["Δευ","Τρί","Τετ","Πέμ","Παρ","Σάβ","Κυρ"];
const DEFAULT_SLOTS="1η περίοδος 07:30\n2η περίοδος 08:15\n1ο διάλειμμα 09:00\n3η περίοδος 09:20\n4η περίοδος 10:05\n2ο διάλειμμα 10:50\n5η περίοδος 11:05\n6η περίοδος 11:50\n7η περίοδος 12:35\n8η περίοδος 13:20";

// ---------- αποθήκευση
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let DB=LS.get("sea-cal",{entries:{}});           // id -> entry (με tombstones: {deleted:true})
let S=LS.get("sea-cal-set",{weekend:false,sync:false,slots:DEFAULT_SLOTS,hidden:[]});
let V={view:LS.get("sea-cal-view","week"),cur:todayStr()};
function persist(){LS.set("sea-cal",DB);queueCloud()}
const live=()=>Object.values(DB.entries).filter(e=>!e.deleted);

// ---------- ημερομηνίες
function pad(n){return String(n).padStart(2,"0")}
function ds(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayStr(){return ds(new Date())}
function pd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addD(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
function mondayOf(s){const d=pd(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ds(d)}
const fmtLong=s=>pd(s).toLocaleDateString("el-GR",{weekday:"long",day:"numeric",month:"long"});
const fmtShort=s=>pd(s).toLocaleDateString("el-GR",{weekday:"short",day:"numeric",month:"numeric"});
const fmtMonth=s=>pd(s).toLocaleDateString("el-GR",{month:"long",year:"numeric"});
function endTime(e){if(!e.start)return"";const [h,m]=e.start.split(":").map(Number);const t=h*60+m+(+e.dur||0);return pad(Math.floor(t/60)%24)+":"+pad(t%60)}
const byTime=(a,b)=>(a.date+(a.start||"99")).localeCompare(b.date+(b.start||"99"));
const onDay=d=>live().filter(e=>e.date===d&&!S.hidden.includes(e.cat)).sort(byTime);
function slots(){return (S.slots||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)\s+(\d{1,2}):(\d{2})$/);return m?{l:m[1],t:pad(+m[2])+":"+m[3]}:null}).filter(Boolean)}
function slotName(t){const s=slots().find(x=>x.t===t);return s?s.l:""}

// ---------- απόδοση
function render(){
  $$(".seg button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===V.view?"page":"false"));
  $("#navd").hidden=!["month","week","list"].includes(V.view);
  LS.set("sea-cal-view",V.view);
  renderToday();
  const m=$("#main");
  if(V.view==="month")m.innerHTML=filters()+monthView();
  else if(V.view==="week")m.innerHTML=filters()+weekView();
  else if(V.view==="list")m.innerHTML=filters()+listView();
  else if(V.view==="req")m.innerHTML=reqView();
  else m.innerHTML=setView();
  bindMain();
  renderSync();
}
function renderToday(){
  const t=todayStr(), td=live().filter(e=>e.date===t&&e.status!=="cancelled").sort(byTime);
  const nxt=td.find(e=>e.status==="planned"&&(e.start||"")>=new Date().toTimeString().slice(0,5));
  const fu=followUps().length, nr=Object.values(R.items).filter(r=>r.status==="new").length;
  $("#today").innerHTML=`
    <button class="stat" data-go="week"><b>${td.length}</b><span>σήμερα${nxt?` · επόμενο ${esc(nxt.start)} ${esc(nxt.title)}`:""}</span></button>
    <button class="stat" data-go="req"><b>${R.signed?nr:"—"}</b><span>${R.signed?"νέα μαθητικά αιτήματα":"αιτήματα: συνδέσου για να τα δεις"}</span></button>
    <button class="stat" data-go="list"><b>${fu}</b><span>εκκρεμότητες / επανέλεγχοι</span></button>`;
  const b=$("#reqBadge");b.hidden=!nr;b.textContent=nr;
  $$("#today [data-go]").forEach(x=>x.onclick=()=>{V.view=x.dataset.go;if(V.view==="week")V.cur=t;render()});
}
function filters(){
  return `<div class="filters no-print" role="group" aria-label="Φίλτρο κατηγοριών">${CATS.map(([k,l])=>`<button class="fchip" data-f="${k}" style="--c:${CAT[k].c}" aria-pressed="${!S.hidden.includes(k)}"><i></i>${esc(l)}</button>`).join("")}</div>`;
}
function evChip(e){return `<button class="ev ${e.status}" data-e="${e.id}" style="--c:${CAT[e.cat]?.c||"var(--k8)"}" title="${esc((e.start||"")+" "+e.title)}">${e.start?esc(e.start)+" ":""}${esc(e.title)}</button>`}
function evCard(e,showDate){
  const sub=[e.who,e.place,e.status!=="planned"?STAT[e.status]:""].filter(Boolean).map(esc).join(" · ");
  return `<button class="card ${e.status}" data-e="${e.id}" style="--c:${CAT[e.cat]?.c||"var(--k8)"}">
    <span class="t">${showDate?esc(fmtShort(e.date))+" · ":""}${e.start?esc(e.start)+(e.dur?"–"+endTime(e):""):"Χωρίς ώρα"}${slotName(e.start)?" · "+esc(slotName(e.start)):""}</span>
    <span class="h">${esc(e.title)}</span>${sub?`<span class="s">${sub}</span>`:""}</button>`;
}
function monthView(){
  const first=pd(V.cur);first.setDate(1);const f=ds(first);
  $("#period").textContent=fmtMonth(f);
  let d=mondayOf(f);const t=todayStr();let h=DOW.map(x=>`<div class="dow">${x}</div>`).join("");
  for(let i=0;i<42;i++){
    const dd=pd(d);if(i>=35&&dd.getMonth()!==first.getMonth())break;

function rulesHelp(){

const RULES=`// Ημερολόγιο Σ.Ε.Α. & αιτήματα μαθητών
function seaAdmin(){ return request.auth != null && request.auth.token.email == '${CFG.adminEmail}'; }
function seaStudentDoc(){
  return request.resource.data.keys().hasOnly(['name','cls','topic','days','when','pace','note','status','createdAt','updatedAt'])
    && request.resource.data.status == 'new'
    && request.resource.data.name is string && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 60
    && request.resource.data.cls is string && request.resource.data.cls.size() <= 10
    && request.resource.data.note is string && request.resource.data.note.size() <= 300;
}
match /seaRequests/{uid} {
  allow read: if seaAdmin() || (request.auth != null && request.auth.uid == uid);
  allow create: if request.auth != null && request.auth.uid == uid && seaStudentDoc();
  allow update: if seaAdmin() || (request.auth != null && request.auth.uid == uid && resource.data.status != 'scheduled' && seaStudentDoc());
  allow delete: if seaAdmin() || (request.auth != null && request.auth.uid == uid && resource.data.status == 'new');
}
match /seaPlanner/{doc} {
  allow read, write: if seaAdmin();
}`;

}

async function fb(){
  if(FS)return true;
  try{
    const B="https://www.gstatic.com/firebasejs/10.12.2/";
    const [{initializeApp},fs,au]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-firestore.js"),import(B+"firebase-auth.js")]);
    FS=fs;AU=au;const app=initializeApp(CFG.firebase,"sea-admin");fdb=fs.getFirestore(app);auth=au.getAuth(app);
    au.onAuthStateChanged(auth,u=>{
      unsub.splice(0).forEach(f=>f());
      R.signed=!!u&&!u.isAnonymous&&(u.email||"").toLowerCase()===CFG.adminEmail.toLowerCase();
      if(R.signed){
        unsub.push(fs.onSnapshot(fs.collection(fdb,"seaRequests"),s=>{const o={};s.forEach(d=>o[d.id]=d.data());R.items=o;R.err="";render()},e=>{R.err=e.code==="permission-denied"?"Δεν υπάρχει άδεια ανάγνωσης (permission-denied). Λείπουν οι κανόνες Firestore.":e.message;render()}));
        if(S.sync)startSync();
      }else{R.items={};cloudOk=false}
      render();
    });
    return true;
  }catch(e){console.error(e);R.err="Δεν φορτώνει η σύνδεση (ίσως δεν υπάρχει internet).";return false}
}

// ---------- συγχρονισμός ημερολογίου ανάμεσα σε συσκευές
let cloudOk=false,cloudTimer=null,lastCloud=0;
function merge(remote){
  let changed=false;
  for(const [id,e] of Object.entries(remote||{})){const l=DB.entries[id];if(!l||(e.upd||0)>(l.upd||0)){DB.entries[id]=e;changed=true}}
  return changed;
}
function startSync(){
  if(!R.signed||!S.sync)return;
  unsub.push(FS.onSnapshot(FS.doc(fdb,"seaPlanner/main"),s=>{
    cloudOk=true;const rem=s.exists()?s.data().entries:{};
    const ch=merge(rem);if(ch){LS.set("sea-cal",DB);render()}
    const need=Object.entries(DB.entries).some(([id,e])=>!rem[id]||(rem[id].upd||0)<(e.upd||0));
    if(need)queueCloud(); else renderSync();
  },e=>{cloudOk=false;R.err=e.code==="permission-denied"?"Ο συγχρονισμός δεν επιτρέπεται ακόμα (permission-denied). Λείπουν οι κανόνες Firestore.":e.message;renderSync()}));
}
function queueCloud(){
  if(!R.signed||!S.sync||!FS)return;
  clearTimeout(cloudTimer);cloudTimer=setTimeout(async()=>{
    // καθάρισμα tombstones παλαιότερων των 60 ημερών
    const lim=Date.now()-60*864e5;for(const [id,e] of Object.entries(DB.entries))if(e.deleted&&e.upd<lim)delete DB.entries[id];
    try{await FS.setDoc(FS.doc(fdb,"seaPlanner/main"),{entries:DB.entries,upd:Date.now()});lastCloud=Date.now();cloudOk=true}catch(e){console.error(e);cloudOk=false}
    renderSync();
  },800);
}
function renderSync(){
  const l=$("#syncLbl");
  if(!S.sync){l.textContent="Αποθηκεύεται σε αυτή τη συσκευή";return}
  if(!R.signed){l.innerHTML=`Συγχρονισμός: <button class="btn ghost sm" id="syncLogin">σύνδεση</button>`;$("#syncLogin").onclick=()=>{V.view="req";render()};return}
  l.textContent=cloudOk?"✓ Συγχρονισμένο σε όλες τις συσκευές σου":"Συγχρονισμός…";
}

    <section style="display:grid;gap:8px"><h2 style="font-size:22px">Συγχρονισμός σε όλες τις συσκευές</h2>
      <p class="small muted">Κανονικά το ημερολόγιο μένει μόνο σε αυτή τη συσκευή. Αν το ενεργοποιήσεις και συνδεθείς (καρτέλα «Μαθητικές αιτήσεις»), θα είναι το ίδιο στο ProBook, στο Mac, στον υπολογιστή του σχολείου και στο κινητό. Τα δεδομένα φυλάσσονται στο Firebase και τα βλέπει μόνο ο λογαριασμός σου.</p>
      <label><input type="checkbox" id="syncOn" ${S.sync?"checked":""}> Συγχρονισμός ενεργός</label></section>
    <section style="display:grid;gap:8px"><h2 style="font-size:22px">Αντίγραφο ασφαλείας & εξαγωγή</h2>
      <div class="row"><button class="btn sm" id="exp">Αποθήκευση αντιγράφου (.json)</button><label class="btn sm">Επαναφορά από αντίγραφο<input type="file" id="imp" accept=".json,application/json" hidden></label>
      <button class="btn sm" id="ics">Εξαγωγή επόμενων 60 ημερών για Google/Outlook/iPhone (.ics)</button></div>
      <p class="small muted">Το .ics ανοίγει σε Google Calendar, Outlook ή στο Ημερολόγιο του iPhone/Mac. Περιέχει τίτλο, ώρα και τόπο, όχι τις σημειώσεις.</p></section>
    <section style="display:grid;gap:8px"><h2 style="font-size:22px">Κανόνες Firebase (μία φορά)</h2>${rulesHelp()}</section>
    <section><button class="btn sm danger" id="wipe">Διαγραφή όλων των καταχωρίσεων από αυτή τη συσκευή</button></section></div>`;
}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/[,;]/g,m=>"\\"+m)}
function makeIcs(){
  const t=todayStr(),to=addD(t,60);const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ergaleiothiki//Hmerologio SEA//EL","CALSCALE:GREGORIAN"];
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  live().filter(e=>e.date>=t&&e.date<=to&&e.status!=="cancelled").forEach(e=>{
    const d=e.date.replace(/-/g,"");L.push("BEGIN:VEVENT","UID:"+e.id+"@sea-hmerologio","DTSTAMP:"+stamp);
    if(e.start){const s=e.start.replace(":","")+"00",en=endTime({...e,dur:e.dur||30}).replace(":","")+"00";L.push("DTSTART;TZID=Asia/Nicosia:"+d+"T"+s,"DTEND;TZID=Asia/Nicosia:"+d+"T"+en)}
    else{L.push("DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+addD(e.date,1).replace(/-/g,""))}
    L.push("SUMMARY:"+icsEsc(e.title),"LOCATION:"+icsEsc(e.place),"CATEGORIES:"+icsEsc(CAT[e.cat]?.l),"END:VEVENT")});
  L.push("END:VCALENDAR");return L.join("\r\n");
}

// ---------- σύνδεση γεγονότων
function bindMain(){
  $$("#main [data-e]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();openEntry(b.dataset.e)});
  $$("#main [data-d]").forEach(d=>{const go=()=>{V.cur=d.dataset.d;V.view="week";render()};d.onclick=go;d.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});
  $$("#main [data-new]").forEach(b=>b.onclick=()=>openEntry(null,{date:b.dataset.new}));
  $$("#main [data-f]").forEach(b=>b.onclick=()=>{const k=b.dataset.f;S.hidden=S.hidden.includes(k)?S.hidden.filter(x=>x!==k):[...S.hidden,k];LS.set("sea-cal-set",S);render()});
  $$("#main [data-fudone]").forEach(b=>b.onclick=()=>{const e=DB.entries[b.dataset.fudone];e.followDone=true;e.upd=Date.now();persist();render()});
  $$("#main [data-fuplan]").forEach(b=>b.onclick=()=>{const e=DB.entries[b.dataset.fuplan];e.followDone=true;e.upd=Date.now();persist();openEntry(null,{date:e.follow,cat:e.cat,title:e.title+" (επανέλεγχος)",who:e.who,place:e.place,notes:e.followNote})});
  // αιτήματα
  $("#copyLink")?.addEventListener("click",()=>copy(new URL("../aitima-sea/",location.href).href));
  $("#copyRules")?.addEventListener("click",()=>copy(RULES));
  $("#login")?.addEventListener("submit",async e=>{e.preventDefault();const f=e.target;$("#lErr").textContent="Σύνδεση…";
    if(!await fb()){$("#lErr").textContent=R.err;return}
    try{await AU.signInWithEmailAndPassword(auth,f.email.value.trim(),f.pass.value)}catch(x){$("#lErr").textContent=x.code==="auth/invalid-credential"||x.code==="auth/wrong-password"?"Λάθος email ή κωδικός.":"Δεν έγινε η σύνδεση: "+x.code}});
  $("#reset")?.addEventListener("click",async()=>{const em=$("#login").email.value.trim();if(!await fb())return;try{await AU.sendPasswordResetEmail(auth,em);$("#lErr").textContent="Στάλθηκε email επαναφοράς στο "+em}catch(x){$("#lErr").textContent="Δεν στάλθηκε: "+x.code}});
  $("#logout")?.addEventListener("click",()=>AU.signOut(auth));
  $("#showDone")?.addEventListener("change",e=>{R.showDone=e.target.checked;render()});
  $$("#main [data-plan]").forEach(b=>b.onclick=()=>{const r=R.items[b.dataset.plan];
    openEntry(null,{reqId:b.dataset.plan,cat:/Επιλογές|Σπουδές/.test(r.topic)?"epag":"math",title:`${r.name} ${r.cls}`.trim(),who:`${r.name} (${r.cls})`,notes:`Θέμα: ${r.topic}${r.note?"\nΣημείωση μαθητή: "+r.note:""}`,date:nextSchoolDay(r.days),start:firstSlotFor(r.when)})});
  $$("#main [data-reply]").forEach(b=>b.onclick=()=>replyDlg(b.dataset.reply));
  $$("#main [data-rdone]").forEach(b=>b.onclick=()=>updReq(b.dataset.rdone,{status:"done"}));
  $$("#main [data-rdel]").forEach(b=>b.onclick=async()=>{if(!confirm("Οριστική διαγραφή του αιτήματος;"))return;try{await FS.deleteDoc(FS.doc(fdb,"seaRequests/"+b.dataset.rdel))}catch(e){toast("Δεν διαγράφηκε: "+e.code)}});
  // ρυθμίσεις
  $("#wkend")?.addEventListener("change",e=>{S.weekend=e.target.checked;LS.set("sea-cal-set",S)});
  $("#saveSlots")?.addEventListener("click",()=>{S.slots=$("#slotsTx").value;LS.set("sea-cal-set",S);toast(`Αποθηκεύτηκαν ${slots().length} ώρες`)});
  $("#resetSlots")?.addEventListener("click",()=>{$("#slotsTx").value=DEFAULT_SLOTS});
  $("#syncOn")?.addEventListener("change",async e=>{S.sync=e.target.checked;LS.set("sea-cal-set",S);if(S.sync){await fb();if(R.signed)startSync();else toast("Συνδέσου στην καρτέλα «Μαθητικές αιτήσεις» για να ξεκινήσει ο συγχρονισμός")}renderSync()});
  $("#exp")?.addEventListener("click",()=>download(`hmerologio-sea-${todayStr()}.json`,JSON.stringify({v:1,entries:DB.entries,settings:S},null,1),"application/json"));
  $("#imp")?.addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;try{const j=JSON.parse(await file.text());if(!j.entries)throw 0;const n=Object.keys(j.entries).length;
    if(!confirm(`Θα προστεθούν/ενημερωθούν ${n} καταχωρίσεις. Συνέχεια;`))return;for(const [id,x] of Object.entries(j.entries)){const l=DB.entries[id];if(!l||(x.upd||0)>=(l.upd||0))DB.entries[id]=x}persist();toast("Έγινε επαναφορά");render()}catch(x){toast("Το αρχείο δεν είναι έγκυρο αντίγραφο")}});
  $("#ics")?.addEventListener("click",()=>download(`hmerologio-sea.ics`,makeIcs(),"text/calendar"));
  $("#wipe")?.addEventListener("click",()=>{if(!confirm("Να διαγραφούν ΟΛΕΣ οι καταχωρίσεις; Κράτα πρώτα αντίγραφο."))return;const now=Date.now();for(const id of Object.keys(DB.entries))DB.entries[id]={id,deleted:true,upd:now};persist();render()});
}
function nextSchoolDay(days){
  const names=["Κυριακή","Δευτέρα","Τρίτη","Τετάρτη","Πέμπτη","Παρασκευή","Σάββατο"];let d=addD(todayStr(),1);
  for(let i=0;i<14;i++){const w=pd(d).getDay();if(w>0&&w<6&&(!days||!days.length||days.includes(names[w])))return d;d=addD(d,1)}return addD(todayStr(),1);
}
function firstSlotFor(when){const sl=slots();for(const w of when||[]){const s=sl.find(x=>x.l.toLowerCase()===w.toLowerCase());if(s)return s.t}return""}
function copy(t){navigator.clipboard?.writeText(t).then(()=>toast("Αντιγράφηκε"),()=>prompt("Αντίγραψε:",t))}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

$$(".seg button").forEach(b=>b.onclick=()=>{V.view=b.dataset.v;if(V.view==="req")fb().then(render);render()});
$("#prev").onclick=()=>{V.cur=V.view==="month"?(()=>{const d=pd(V.cur);d.setDate(1);d.setMonth(d.getMonth()-1);return ds(d)})():addD(V.cur,V.view==="week"?-7:-30);render()};
$("#next").onclick=()=>{V.cur=V.view==="month"?(()=>{const d=pd(V.cur);d.setDate(1);d.setMonth(d.getMonth()+1);return ds(d)})():addD(V.cur,V.view==="week"?7:30);render()};
$("#goToday").onclick=()=>{V.cur=todayStr();render()};
$("#newBtn").onclick=()=>{const t=todayStr();const same=V.view==="month"?V.cur.slice(0,7)===t.slice(0,7):mondayOf(V.cur)===mondayOf(t);openEntry(null,{date:same?t:V.cur})};
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select,dialog"))return;if(e.key==="n"){e.preventDefault();$("#newBtn").click()}});
window.addEventListener("storage",e=>{if(e.key==="sea-cal"){DB=LS.get("sea-cal",{entries:{}});render()}});

render();
// σύνδεση στο παρασκήνιο, ώστε ο μετρητής αιτημάτων να φαίνεται αμέσως αν έχεις ήδη συνδεθεί
fb();
</script>
