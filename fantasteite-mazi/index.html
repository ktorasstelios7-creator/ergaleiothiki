<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Φανταστείτε μαζί: Ένα δικοινοτικό ταξίδι για το Κυπριακό</title>
<meta name="description" content="Διαδραστικό πρόγραμμα για μαθητές Λυκείου: γνωριμία Ελληνοκυπρίων και Τουρκοκυπρίων εφήβων, πολυπρισματική ματιά στην ιστορία και κοινά έργα, με βάση το πρόγραμμα ειρηνικής εκπαίδευσης Imagine.">
<meta name="theme-color" content="#6b3f72">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/favicon.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Εργαλειοθήκη">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a year-long journey across one island. Four phases as a path of 13 stations; each station opens an activity. Everything stays on the device. */
:root{
  --bg:#EEF3F2;--surface:#FFFFFF;--soft:#DCEAE8;--ink:#152A2B;--muted:#55696A;--line:#C9DCDA;
  --accent:#1F6F78;--accent-ink:#FFFFFF;--warm:#E0A43A;--warm-soft:#FBEED6;
  --good:#2D8A57;--ok:#B7791F;--bad:#C2412D;
  --p0:#7B8794;--p1:#1F6F78;--p2:#C0703A;--p3:#6B3F72;--p4:#2D8A57;
  --font-d:'Literata',Georgia,'Times New Roman',serif;--font-b:'Commissioner',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --r:14px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1717;--surface:#132222;--soft:#1B302F;--ink:#E2EEED;--muted:#9AB1B0;--line:#284140;
  --accent:#5EC2CC;--accent-ink:#062022;--warm:#F0BC62;--warm-soft:#3A2D16;
  --good:#5CC48A;--ok:#E5B04F;--bad:#F07C66;
  --p0:#A5B1BD;--p1:#5EC2CC;--p2:#EBA06C;--p3:#C49ACB;--p4:#5CC48A;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:17px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--font-d);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,5vw,2.5rem)}h2{font-size:1.5rem}h3{font-size:1.15rem}
p{margin:0}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--warm);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:.9rem}
.prose{max-width:65ch}
ul.clean,ol.clean{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--font-d);font-weight:700;font-size:1.2rem}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sos{background:var(--warm);border-color:var(--warm);color:#1d1205}
.btn.ghost{background:transparent}
main{padding:24px 0 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.soft{background:var(--soft);border-color:transparent}
.take{background:var(--warm-soft);border-left:5px solid var(--warm);border-radius:10px;padding:14px 16px}
.eyebrow{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem}
.vhead{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.sec-title{margin:30px 0 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.chip{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);align-self:flex-start}
.chip.ok{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--good)}
textarea,input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
textarea{min-height:70px;resize:vertical}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tablebox{overflow-x:auto}
footer{border-top:1px solid var(--line);padding:22px 0 70px;color:var(--muted);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media print{.top,.no-print,footer,.ergal-top{display:none!important}body{background:#fff;color:#000}.card{border-color:#999}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:stretch}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero>*,.lens>*,.grid2>*{min-width:0}
.btn.sos{white-space:nowrap}
@media (max-width:420px){.brand{font-size:1.02rem}.btn.sos{padding:8px 12px;font-size:.9rem}}
html,body{overflow-x:hidden}
.island{width:100%;height:auto;display:block}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}

/* path of stations */
.phase{--pc:var(--p1);border-left:5px solid var(--pc);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:10px}
.phase h3 small{display:block;font-family:var(--font-b);font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.03em}
.stations{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.st{--pc:var(--p1);display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:transform .12s,border-color .12s}
.st:hover{transform:translateY(-2px);border-color:var(--pc)}
.st .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:color-mix(in srgb,var(--pc) 16%,var(--surface));color:var(--pc);border:2px solid var(--pc)}
.st.done .n{background:var(--pc);color:#fff}
.st b{display:block;line-height:1.3}
.st span{font-size:.88rem;color:var(--muted)}

/* activities */
.tag{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer}
.tag[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.idc{position:relative;width:min(340px,90vw);aspect-ratio:1;margin:8px auto}
.idc .core{position:absolute;inset:34%;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;text-align:center;font-weight:700;font-family:var(--font-d);font-size:1.05rem}
.idc .bub{position:absolute;transform:translate(-50%,-50%);background:var(--warm-soft);border:2px solid var(--warm);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.9rem;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.sortq{font-family:var(--font-d);font-size:1.3rem;line-height:1.35;padding:20px;border-radius:16px;background:var(--soft)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.s2{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.s1{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.s0{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt.dim{opacity:.6}
.fb{border-radius:12px;padding:14px 16px;background:var(--soft);display:flex;flex-direction:column;gap:6px}
.fb b.t2{color:var(--good)}.fb b.t1{color:var(--ok)}.fb b.t0{color:var(--bad)}
.next{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.three{grid-template-columns:1fr}}
.flip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.flip b{font-family:var(--font-d);font-size:1.2rem}
.flip .bk{display:none;color:var(--ink)}
.flip .hint{font-size:.8rem;color:var(--muted)}
.flip[aria-expanded="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.flip[aria-expanded="true"] .bk{display:block}
.flip[aria-expanded="true"] .hint{display:none}
.tr{font-family:var(--font-d);font-size:1.25rem;color:var(--accent);font-weight:700}
.lens{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.lens{grid-template-columns:1fr}}
.qcard{font-family:var(--font-d);font-size:1.35rem;line-height:1.35;padding:26px 22px;border-radius:18px;background:var(--warm-soft);border:2px dashed var(--warm);text-align:center;min-height:130px;display:grid;place-items:center}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.check input{flex:none;width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.sl{display:flex;flex-direction:column;gap:4px}
.sl input{width:100%;accent-color:var(--accent)}
.sl .ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 60px 60px;gap:6px 12px;align-items:center}
.cmp .h{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.cmp .v{font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.entry{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.line{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.line .tel{font-family:var(--font-d);font-size:1.45rem;font-weight:700;color:var(--accent);min-width:110px;font-variant-numeric:tabular-nums;text-decoration:none}
@media (max-width:520px){.line{flex-direction:column;align-items:flex-start;gap:4px}}
.pact{counter-reset:p;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.pact li{counter-increment:p;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.pact li::before{content:counter(p);flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.tl{display:flex;flex-direction:column;gap:0;border-left:3px solid var(--line);margin-left:8px}
.tl div{position:relative;padding:6px 0 14px 18px}
.tl div::before{content:"";position:absolute;left:-9px;top:10px;width:15px;height:15px;border-radius:50%;background:var(--accent)}
.tl b{font-family:var(--font-d);font-size:1.1rem}
</style>
</head>
<body>
<div class="ergal-top" role="navigation" aria-label="Εργαλειοθήκη"><a class="ergal-top-a" id="ergalTop" href="../">← Επιστροφή στην Εργαλειοθήκη</a></div>
<style>.ergal-top{display:block;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 6px;position:relative;z-index:30;text-align:left}.ergal-top-a{display:inline-flex;align-items:center;gap:6px;background:#6b3f72;color:#fff!important;text-decoration:none!important;font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;padding:11px 16px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.18)}.ergal-top-a:hover{background:#5a3360}.ergal-top-a:focus-visible{outline:3px solid #e0b84f;outline-offset:2px}@media print{.ergal-top{display:none!important}}</style>
<script>try{if(localStorage.getItem('ergal-st')==='1')document.getElementById('ergalTop').href='../?mathites'}catch(e){}</script>

<style>
.lang{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-weight:700;font-size:.9rem;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:420px){.lang button{padding:6px 9px}}
.top .wrap{gap:8px}.brand{min-width:0;flex:1 1 auto}.btn.sos{flex:none}
@media (max-width:420px){.top .grow{display:none}.brand svg{flex:none}}
@media (max-width:400px){#brandName{display:none}.brand{flex:0 0 auto}.top .grow{display:block}}
</style>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" id="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="var(--accent)"/><path d="M8 19c3-1 4-5 8-5s5 2 9 1" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="11" r="2.4" fill="var(--warm)"/><circle cx="22" cy="11" r="2.4" fill="var(--accent-ink)"/><path d="M9 24h16" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round" opacity=".6"/></svg>
      <span id="brandName">Φανταστείτε μαζί</span>
    </a>
    <div class="grow"></div>
    <div class="lang" role="group" aria-label="Γλώσσα / Dil"><button data-lang="el" lang="el" aria-pressed="true">ΕΛ</button><button data-lang="tr" lang="tr" aria-pressed="false">TR</button></div>
    <a class="btn sos" href="#help" id="sosBtn">Ζήτα βοήθεια</a>
  </div>
</header>

<main class="wrap" id="app" tabindex="-1"></main>

<footer><div class="wrap stack" style="gap:6px" id="foot"></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const app=document.getElementById('app');
/* ---------- language ---------- */
let L='el';
try{const q=location.search; if(/(^|[?&])tr\b/.test(q)) L='tr'; else if(/(^|[?&])el\b/.test(q)) L='el'; else {const s=localStorage.getItem('fm-lang'); if(s==='tr'||s==='el') L=s;}}catch(e){}
const t=(el,tr)=>L==='tr'?tr:el;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(x){const e=document.getElementById('toast');e.textContent=x;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2400);}
const back=()=>`<a class="back" href="#home">${t('← Η διαδρομή μου','← Yolculuğum')}</a>`;
const doneBtn=(i,go,txt)=>`<button class="btn${go?'':' '}" data-done="${i}"${go?` data-go="${go}"`:''}>${txt||t('Ολοκληρώθηκε · επόμενος σταθμός','Tamamlandı · sonraki durak')}</button>`;

function chrome(){
 document.documentElement.lang=L;
 document.title=t('Φανταστείτε μαζί: Ένα δικοινοτικό ταξίδι για το Κυπριακό','Birlikte Hayal Edin: Kıbrıs sorunu üzerine iki toplumlu bir yolculuk');
 document.getElementById('brandName').textContent=t('Φανταστείτε μαζί','Birlikte Hayal Edin');
 document.getElementById('brand').setAttribute('aria-label',t('Φανταστείτε μαζί, αρχική','Birlikte Hayal Edin, ana sayfa'));
 document.getElementById('sosBtn').textContent=t('Ζήτα βοήθεια','Yardım iste');
 const top=document.getElementById('ergalTop'); if(top) top.textContent=t('← Επιστροφή στην Εργαλειοθήκη','← Araç Kutusu’na dön');
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===L));
 document.getElementById('foot').innerHTML=t(
  `<p>«Φανταστείτε μαζί», Στέλιος Κτώρας, Καθηγητής Σ.Ε.Α., Γραφείο 10. Μέρος της <a href="https://ktorasstelios7-creator.github.io/ergaleiothiki/">Σύγχρονης Εργαλειοθήκης για εκπαιδευτικούς και μαθητές</a>. Βασίζεται στο πρόγραμμα ειρηνικής εκπαίδευσης <a href="#imagine">Imagine</a> και σε διεθνή προγράμματα συνύπαρξης.</p><p class="small">Ό,τι γράφεις μένει μόνο σε αυτή τη συσκευή. Δεν το βλέπει κανείς άλλος και μπορείς να το σβήσεις όποτε θέλεις. <a href="#teachers">Για εκπαιδευτικούς</a> · <a href="#imagine">Τι είναι το Imagine</a></p>`,
  `<p>«Birlikte Hayal Edin», Stelios Ktoras, Arhangelos Lisesi rehber öğretmeni. <a href="https://ktorasstelios7-creator.github.io/ergaleiothiki/">Öğretmenler ve öğrenciler için Çağdaş Araç Kutusu</a>’nun bir parçasıdır. <a href="#imagine">Imagine</a> barış eğitimi programına ve dünyadaki bir arada yaşama programlarına dayanır.</p><p class="small">Yazdıkların yalnızca bu cihazda kalır. Başka kimse göremez ve istediğin zaman silebilirsin. <a href="#teachers">Öğretmenler için</a> · <a href="#imagine">Imagine nedir?</a></p>`);
}

/* ---------- state (local only) ---------- */
const KEY='fantasteite-mazi-v1';
const fresh=()=>({done:{},ids:[],idFree:'',journal:{},pre:null,post:null,pact:[],proj:{type:null,steps:{},notes:''},iv:{},lens:{a:'',b:'',q:{}}});
let S=fresh();
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- the year ---------- */
const PH=()=>[
 {c:'var(--p1)',t:t('Φάση 1 · Κοιτάμε μέσα μας','1. Aşama · Kendimize bakıyoruz'),w:t('Ιανουάριος–Φεβρουάριος · στο σχολείο','Ocak–Şubat · okulda')},
 {c:'var(--p2)',t:t('Φάση 2 · Συναντιόμαστε','2. Aşama · Buluşuyoruz'),w:t('Μάρτιος–Απρίλιος · Σπίτι της Συνεργασίας, Λήδρα Πάλας','Mart–Nisan · Dayanışma Evi (H4C), Ledra Palace')},
 {c:'var(--p3)',t:t('Φάση 3 · Δημιουργούμε μαζί','3. Aşama · Birlikte üretiyoruz'),w:t('Απρίλιος–Μάιος · μικτές ομάδες, online και από κοντά','Nisan–Mayıs · karma gruplar, çevrim içi ve yüz yüze')},
 {c:'var(--p4)',t:t('Φάση 4 · Μοιραζόμαστε','4. Aşama · Paylaşıyoruz'),w:t('Μάιος–Ιούνιος · κοινή εκδήλωση και αναστοχασμός','Mayıs–Haziran · ortak etkinlik ve değerlendirme')}
];
const ST=()=>[
 {p:0,t:t('Ποιοι είμαστε;','Biz kimiz?'),d:t('Ο κύκλος της ταυτότητάς μου','Kimlik çemberim'),r:'taftotita'},
 {p:0,t:t('Τι ακούμε για «τους άλλους»;','«Ötekiler» hakkında ne duyuyoruz?'),d:t('Γεγονός, άποψη ή στερεότυπο;','Gerçek mi, görüş mü, kalıp yargı mı?'),r:'stereotypa'},

 return `${back()}<div class="vhead" style="margin-top:12px"><span class="eyebrow">${t('Δεν είσαι μόνος/η','Yalnız değilsin')}</span><h1>${t('Πού μπορώ να μιλήσω','Kiminle konuşabilirim?')}</h1><p class="prose">${t('Τα θέματα του Κυπριακού αγγίζουν οικογενειακές ιστορίες και μπορεί να ξυπνήσουν δύσκολα συναισθήματα. Αν κάτι σε βαραίνει, <b>μίλα με τον Καθηγητή ΣΕΑ ή έναν ενήλικα που εμπιστεύεσαι</b>.','Kıbrıs sorunuyla ilgili konular aile hikâyelerine dokunur ve zor duyguları uyandırabilir. Bir şey seni zorluyorsa <b>okulundaki rehber öğretmenle, AHDR eğitmeniyle ya da güvendiğin bir yetişkinle konuş</b>.')}</p></div>
 ${L==='el'?`<div class="row" style="margin-bottom:16px"><a class="btn primary" href="../aitima-sea/">Κλείσε συνάντηση στο Γραφείο 10</a><a class="btn" href="../anasa/">Ανάσα: ηρέμησε τώρα</a></div>`:''}
 <div class="stack">${LINES().map(l=>`<div class="line"><a class="tel" href="tel:${l[0].replace(/\s/g,'')}">${l[0]}</a><div><b>${l[1]}</b><p class="small muted">${l[2]}</p></div></div>`).join('')}</div>`;
}

/* ---------- router ---------- */
function route(){
 chrome();
 const h=(location.hash||'#home').slice(1), [r,arg]=h.split('?');
 let out;
 if(r.startsWith('st-')) out=station(+r.slice(3));
 else out=({home,taftotita,stereotypa,istories,synenteuxi,diafonia,lexeis,symfono,peripatos,martyries,ergo,online,ekdilosi,'prin-meta':prinMeta,imerologio:()=>imerologio(arg!=null?+arg:null),imagine,teachers,help}[r]||home)();
 app.innerHTML=out; scrollTo(0,0); app.focus({preventScroll:true});
}
addEventListener('hashchange',route);
function rerender(){const y=scrollY;route();scrollTo(0,y);}

document.querySelector('.lang').addEventListener('click',e=>{
 const b=e.target.closest('[data-lang]'); if(!b||b.dataset.lang===L) return;
 L=b.dataset.lang; try{localStorage.setItem('fm-lang',L)}catch(x){}
 sqA=null;scA=null; rerender(); toast(t('Ελληνικά','Türkçe'));
});

app.addEventListener('click',e=>{
 const x=e.target;
 const d=x.closest('[data-done]'); if(d){const i=+d.dataset.done; if(d.dataset.go){S.done[i]=true;save();toast(t('Ο σταθμός ολοκληρώθηκε ✓','Durak tamamlandı ✓'));location.hash='#'+d.dataset.go;return;} S.done[i]=!S.done[i]; save(); toast(S.done[i]?t('Ο σταθμός ολοκληρώθηκε ✓','Durak tamamlandı ✓'):t('Αναιρέθηκε','Geri alındı')); rerender(); return;}
 const fl=x.closest('.flip'); if(fl){fl.setAttribute('aria-expanded',fl.getAttribute('aria-expanded')==='true'?'false':'true');return;}
 const id=x.closest('[data-id]'); if(id){const v=id.dataset.id,ids=IDS(); S.ids=S.ids.filter(z=>ids.includes(z)); const k=S.ids.indexOf(v); if(k>=0)S.ids.splice(k,1); else if(S.ids.length<5)S.ids.push(v); else {toast(t('Μέχρι 5. Ποια σε περιγράφουν περισσότερο;','En fazla 5. Hangileri seni daha çok anlatıyor?'));return;} save(); rerender(); return;}
 const sq=x.closest('[data-sq]'); if(sq&&!sqA){sqA=sq.dataset.sq; if(sqA===SQ()[sqI][1])sqScore++; rerender(); return;}
 if(x.closest('#sqNext')){sqI++;sqA=null;route();return;}
 if(x.closest('#sqRe')){sqI=0;sqA=null;sqScore=0;route();return;}
 const sc=x.closest('[data-sc]'); if(sc&&scA===null){scA=+sc.dataset.sc; rerender(); return;}
 if(x.closest('#scNext')){scI++;scA=null;route();return;}
 if(x.closest('#scRe')){scI=0;scA=null;route();return;}
 if(x.closest('#qcNext')){const n=QC().length; qcI=(qcI+1+Math.floor(Math.random()*(n-1)))%n; rerender(); return;}
 const pj=x.closest('[data-pj]'); if(pj){if(S.proj.type!==pj.dataset.pj){S.proj.type=pj.dataset.pj;S.proj.steps={};} save(); rerender(); return;}
 const saved=()=>toast(t('Αποθηκεύτηκε','Kaydedildi'));
 if(x.closest('#saveLens')){S.lens.a=document.getElementById('lensA').value;S.lens.b=document.getElementById('lensB').value;save();saved();return;}
 if(x.closest('#saveIv')){document.querySelectorAll('[data-iv]').forEach(z=>S.iv[z.dataset.iv]=z.value);save();saved();return;}
 if(x.closest('#savePj')){S.proj.notes=document.getElementById('pjNotes').value;save();saved();return;}
 if(x.closest('#saveDecl')){S.decl=document.getElementById('decl').value;save();saved();return;}
 if(x.closest('#saveJ')){const i=+document.getElementById('jSel').value;S.journal[i]={a:document.getElementById('ja').value,b:document.getElementById('jb').value,c:document.getElementById('jc').value};save();toast(t('Αποθηκεύτηκε στο ημερολόγιο 📓','Günlüğe kaydedildi 📓'));if(location.hash!=='#imerologio?'+i)location.hash='#imerologio?'+i;else rerender();return;}
 const pm=x.closest('#savePm'); if(pm){S[pm.dataset.mode]=PM().map((q,k)=>+document.getElementById('pm'+k).value); save(); saved(); rerender(); return;}
 if(x.closest('#pmReset')){if(confirmArm('pm')){S.pre=null;S.post=null;save();rerender();toast(t('Σβήστηκαν','Silindi'));}return;}
 if(x.closest('#wipe')){if(confirmArm('wipe')){try{localStorage.removeItem(KEY)}catch(z){} S=fresh();location.hash='#home';route();toast(t('Όλα σβήστηκαν','Her şey silindi'));}return;}
});
let armed=null;
function confirmArm(k){if(armed===k){armed=null;return true;} armed=k; toast(t('Πάτησε ξανά για επιβεβαίωση','Onaylamak için tekrar dokun')); setTimeout(()=>{if(armed===k)armed=null},3000); return false;}
app.addEventListener('change',e=>{
 const x=e.target;
 if(x.id==='idFree'){S.idFree=x.value.trim().slice(0,24);save();rerender();return;}
 if(x.dataset.lq!=null){S.lens.q[x.dataset.lq]=x.checked;save();return;}
 if(x.dataset.pact!=null){const k=+x.dataset.pact,i=S.pact.indexOf(k); if(x.checked&&i<0)S.pact.push(k); if(!x.checked&&i>=0)S.pact.splice(i,1); save(); rerender(); return;}
 if(x.id==='pactOwn'){S.pactOwn=x.value.trim().slice(0,120);save();rerender();return;}
 if(x.dataset.ps!=null){S.proj.steps[x.dataset.ps]=x.checked;save();rerender();return;}
 if(x.dataset.tc!=null){S.tc=S.tc||{};S.tc[x.dataset.tc]=x.checked;save();return;}
 if(x.id==='jSel'){location.hash='#imerologio?'+x.value;return;}
});
route();
})();
</script>
